<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>鹅了个鹅</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: 'PingFang SC', 'Microsoft YaHei', sans-serif;
            background: #684C9E;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
        }

        .game-container {
            width: 100%;
            max-width: 750px;
            height: 100vh;
            background: linear-gradient(180deg, #8E76B8 0%, #684C9E 100%);
            display: flex;
            flex-direction: column;
            position: relative;
            overflow: hidden;
        }

        .main-menu {
            flex: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 20px;
            gap: 15px;
        }

        .menu-title {
            font-size: 36px;
            font-weight: 800;
            color: #F6C11D;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.3);
        }

        .stats { display: flex; gap: 60px; margin: 20px 0; }
        .stat-item { text-align: center; }
        .stat-value { font-size: 32px; font-weight: 700; color: #fff; }
        .stat-label { font-size: 14px; color: rgba(255,255,255,0.7); }

        .menu-btn {
            width: 220px; height: 50px;
            background: rgba(246, 193, 29, 0.2);
            border: 2px solid #F6C11D;
            color: #F6C11D; border-radius: 25px;
            font-size: 16px; font-weight: 600;
            cursor: pointer;
        }
        .menu-btn:hover { background: #F6C11D; color: #684C9E; }
        .menu-btn-primary { background: #F6C11D; border: none; color: #684C9E; }

        .game-screen {
            display: none;
            flex-direction: column;
            height: 100vh;
            overflow: hidden;
        }

        .game-header {
            display: flex; justify-content: space-between; align-items: center;
            padding: 10px 20px; color: #fff;
            background: rgba(0,0,0,0.2);
            flex-shrink: 0;
        }
        .game-title { font-size: 16px; font-weight: 600; color: #F6C11D; }
        .game-level { font-size: 14px; opacity: 0.8; }
        .header-btns { display: flex; gap: 10px; }
        .header-btn {
            width: 36px; height: 36px;
            background: rgba(246, 193, 29, 0.3);
            border: none; border-radius: 50%;
            color: #fff; font-size: 16px; cursor: pointer;
        }

        .map-area {
            flex: 1;
            overflow: auto;
            display: flex;
            justify-content: center;
        }

        .map-container {
            width: 700px;
            min-height: 800px;
            position: relative;
            background: rgba(255,255,255,0.05);
        }

        .tile {
            position: absolute;
            width: 81px; height: 90px;
            border-radius: 8px;
            display: flex; align-items: center; justify-content: center;
            cursor: pointer;
            transition: transform 0.15s ease;
        }
        .tile img {
            width: 81px;
            height: 90px;
            object-fit: contain;
            pointer-events: none;
        }
        .tile:hover:not(.disabled) {
            transform: scale(1.05);
        }
        .tile.disabled {
            opacity: 0.4;
            cursor: not-allowed;
            filter: saturate(0.3);
        }

        .collect-area {
            padding: 15px;
            background: rgba(0,0,0,0.2);
            border-top: 2px solid #F6C11D;
            flex-shrink: 0;
        }
        .collect-grid {
            display: grid;
            grid-template-columns: repeat(7, 1fr);
            gap: 8px;
            max-width: 600px;
            margin: 0 auto;
        }
        .collect-slot {
            aspect-ratio: 1;
            background: rgba(142, 118, 184, 0.3);
            border: 2px solid rgba(246, 193, 29, 0.4);
            border-radius: 8px;
            display: flex; align-items: center; justify-content: center;
        }
        .collect-slot .tile {
            position: relative; width: 95%; height: 95%;
            animation: tileAppear 0.2s ease-out;
        }

        @keyframes tileAppear {
            0% { transform: scale(0) rotate(-15deg); }
            100% { transform: scale(1) rotate(0deg); }
        }

        @keyframes tileEliminate {
            0% { transform: scale(1); opacity: 1; }
            50% { transform: scale(1.3) rotate(10deg); }
            100% { transform: scale(0) rotate(-20deg); opacity: 0; }
        }
        .tile.eliminating { animation: tileEliminate 0.3s ease-out forwards; }

        .game-footer {
            display: flex; justify-content: space-between;
            padding: 12px 20px; padding-bottom: 20px;
            background: rgba(0,0,0,0.2);
            flex-shrink: 0;
        }
        .prop-btn {
            display: flex; align-items: center; gap: 8px;
            padding: 10px 16px; background: #F6C11D;
            border: none; border-radius: 20px;
            color: #684C9E; font-size: 14px;
        }
        .prop-btn:disabled { opacity: 0.5; }
        .prop-btn .count {
            background: #684C9E; color: #fff;
            padding: 2px 8px; border-radius: 10px;
            font-size: 12px; font-weight: 600;
        }
        .give-up-btn {
            padding: 10px 16px; background: rgba(255,255,255,0.15);
            border: none; border-radius: 20px;
            color: #fff; font-size: 14px;
        }

        .modal {
            position: absolute; top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(0, 0, 0, 0.92);
            display: none; flex-direction: column;
            align-items: center; justify-content: center;
            z-index: 100;
        }
        .modal.active { display: flex; }
        .modal-content {
            background: #fff; border-radius: 16px; padding: 24px;
            text-align: center; max-width: 300px; width: 90%;
        }
        .modal-title { font-size: 24px; font-weight: 800; color: #684C9E; margin-bottom: 12px; }
        .modal-title.win { color: #F6C11D; }
        .modal-text { font-size: 14px; color: #666; margin-bottom: 8px; }
        .modal-btns { display: flex; flex-direction: column; gap: 10px; margin-top: 16px; }
        .modal-btn {
            padding: 12px 20px; border: none; border-radius: 20px;
            font-size: 14px; font-weight: 600; cursor: pointer;
        }
        .modal-btn-primary { background: #F6C11D; color: #684C9E; }
        .modal-btn-secondary { background: rgba(246, 193, 29, 0.15); color: #684C9E; }

        .settings-content { text-align: left; }
        .setting-item {
            display: flex; justify-content: space-between; align-items: center;
            padding: 12px 0; border-bottom: 1px solid #eee;
        }
        .setting-item:last-of-type { border-bottom: none; }
        .toggle {
            width: 44px; height: 24px; background: #ccc; border-radius: 12px;
            position: relative; cursor: pointer;
        }
        .toggle.active { background: #F6C11D; }
        .toggle::after {
            content: ''; position: absolute;
            width: 20px; height: 20px; background: #fff; border-radius: 50%;
            top: 2px; left: 2px; transition: all 0.2s;
        }
        .toggle.active::after { left: 22px; }
        .close-modal { margin-top: 16px; padding: 10px; }

        @media (max-width: 380px) {
            .tile { width: 60px; height: 67px; }
            .tile img { width: 54px; height: 61px; }
            .menu-title { font-size: 28px; }
        }
    </style>
</head>
<body>
    <div class="game-container">
        <div class="main-menu" id="mainMenu">
            <div class="menu-title">鹅了个鹅</div>
            <div class="stats">
                <div class="stat-item">
                    <div class="stat-value" id="totalGames">0</div>
                    <div class="stat-label">已挑战</div>
                </div>
                <div class="stat-item">
                    <div class="stat-value" id="totalWins">0</div>
                    <div class="stat-label">已通关</div>
                </div>
            </div>
            <button class="menu-btn menu-btn-primary" id="btnStart">开始游戏</button>
            <button class="menu-btn" id="btnSettings">设置</button>
        </div>

        <div class="game-screen" id="gameScreen">
            <div class="game-header">
                <div>
                    <div class="game-title">鹅了个鹅</div>
                </div>
                <div class="header-btns">
                    <button class="header-btn" id="btnBack">←</button>
                    <button class="header-btn" id="btnGameSettings">⚙</button>
                </div>
            </div>

            <div class="map-area">
                <div class="map-container" id="mapContainer"></div>
            </div>

            <div class="collect-area">
                <div class="collect-grid" id="collectGrid"></div>
            </div>

            <div class="game-footer">
                <button class="prop-btn" id="btnProp">
                    <span>🧹</span>
                    <span>移出</span>
                    <span class="count" id="propCount">3</span>
                </button>
                <button class="prop-btn" id="btnShuffle">
                    <span>🔀</span>
                    <span>打乱</span>
                    <span class="count" id="shuffleCount">3</span>
                </button>
                <button class="give-up-btn" id="btnGiveUp">放弃挑战</button>
            </div>
        </div>

        <div class="modal" id="winModal">
            <div class="modal-content">
                <div class="modal-title win">🎉 恭喜通关！</div>
                <div class="modal-text" id="winTime">用时：00:00</div>
                <div class="modal-text" id="winLevel">第1关</div>
                <div class="modal-btns">
                    <button class="modal-btn modal-btn-primary" id="btnWinRestart">下一关</button>
                    <button class="modal-btn modal-btn-secondary" id="btnWinMenu">返回主页</button>
                </div>
            </div>
        </div>

        <div class="modal" id="failModal">
            <div class="modal-content">
                <div class="modal-title">😢 再接再厉</div>
                <div class="modal-text">格子已满，无法继续</div>
                <div class="modal-btns">
                    <button class="modal-btn modal-btn-primary" id="btnFailRestart">重试本关</button>
                    <button class="modal-btn modal-btn-secondary" id="btnFailMenu">返回主页</button>
                </div>
            </div>
        </div>

        <div class="modal" id="settingsModal">
            <div class="modal-content settings-content">
                <div class="modal-title">设置</div>
                <div class="setting-item">
                    <span>音效</span>
                    <div class="toggle active" id="toggleSound"></div>
                </div>
                <button class="modal-btn modal-btn-secondary close-modal" id="btnCloseSettings">关闭</button>
            </div>
        </div>
    </div>

        71: { layout: [{"X":289,"Y":352},{"X":370,"Y":352},{"X":289,"Y":442},{"X":370,"Y":442},{"X":532,"Y":352},{"X":532,"Y":262}], weight: [50,20,40,20,40,20,20,20,20,20,20,20] }
    };

    // 添加更多单格布局
    for(var i = 100; i <= 189; i++) {
        LAYOUT_CONFIG[i] = { layout: [{"X":127,"Y":1002}], weight: [50,40,20,20,40,40,20,40,20,20,20,40,20,20,20,20,20] };
    }

    var cardPool = [];
    var state = {
        level: 1,
        difficulty: 1,
        cards: [],
        collect: [],
        propCount: 3,
        shuffleCount: 3,
        startTime: null,
        isPlaying: false,
        soundEnabled: true
    };
    var $ = {};

    function init() {
        cacheElements();
        loadSettings();
        loadStats();
        bindEvents();
    }

    function cacheElements() {
        $.mainMenu = document.getElementById('mainMenu');
        $.gameScreen = document.getElementById('gameScreen');
        $.mapContainer = document.getElementById('mapContainer');
        $.collectGrid = document.getElementById('collectGrid');
        $.totalGames = document.getElementById('totalGames');
        $.totalWins = document.getElementById('totalWins');
        $.propCount = document.getElementById('propCount');
        $.btnProp = document.getElementById('btnProp');
        $.shuffleCount = document.getElementById('shuffleCount');
        $.btnShuffle = document.getElementById('btnShuffle');
        $.btnBack = document.getElementById('btnBack');
        $.btnGameSettings = document.getElementById('btnGameSettings');
        $.btnGiveUp = document.getElementById('btnGiveUp');
        $.btnWinRestart = document.getElementById('btnWinRestart');
        $.btnWinMenu = document.getElementById('btnWinMenu');
        $.btnFailRestart = document.getElementById('btnFailRestart');
        $.btnFailMenu = document.getElementById('btnFailMenu');
        $.btnCloseSettings = document.getElementById('btnCloseSettings');
        $.toggleSound = document.getElementById('toggleSound');
        $.winModal = document.getElementById('winModal');
        $.failModal = document.getElementById('failModal');
        $.settingsModal = document.getElementById('settingsModal');
        $.winTime = document.getElementById('winTime');
        $.winLevel = document.getElementById('winLevel');
        $.levelInfo = document.getElementById('levelInfo');
    }

    function bindEvents() {
        document.getElementById('btnStart').addEventListener('click', startGame);
        document.getElementById('btnSettings').addEventListener('click', showSettings);
        $.btnBack.addEventListener('click', backToMenu);
        $.btnGameSettings.addEventListener('click', showSettings);
        $.btnProp.addEventListener('click', useProp);
        $.btnShuffle.addEventListener('click', useShuffle);
        $.btnGiveUp.addEventListener('click', giveUp);
        $.btnWinRestart.addEventListener('click', nextLevel);
        $.btnWinMenu.addEventListener('click', backToMenu);
        $.btnFailRestart.addEventListener('click', restartLevel);
        $.btnFailMenu.addEventListener('click', backToMenu);
        $.btnCloseSettings.addEventListener('click', hideSettings);
        $.toggleSound.addEventListener('click', toggleSound);
    }

    function loadSettings() {
        var s = localStorage.getItem('sha-settings');
        if (s) {
            var data = JSON.parse(s);
            state.soundEnabled = data.soundEnabled !== false;
        }
        updateSoundToggle();
    }

    function saveSettings() {
        localStorage.setItem('sha-settings', JSON.stringify({ soundEnabled: state.soundEnabled }));
    }

    function loadStats() {
        var s = localStorage.getItem('sha-stats');
        if (s) {
            var data = JSON.parse(s);
            $.totalGames.textContent = data.totalGames || 0;
            $.totalWins.textContent = data.totalWins || 0;
            state.level = data.currentLevel || 1;
        }
    }

    function saveStats(win) {
        var data = { totalGames: 0, totalWins: 0, currentLevel: state.level };
        var s = localStorage.getItem('sha-stats');
        if (s) data = JSON.parse(s);
        data.totalGames = (data.totalGames || 0) + 1;
        if (win) {
            data.totalWins = (data.totalWins || 0) + 1;
            data.currentLevel = state.level + 1;
        }
        localStorage.setItem('sha-stats', JSON.stringify(data));
        $.totalGames.textContent = data.totalGames;
        $.totalWins.textContent = data.totalWins;
    }

    function playSound(type) {
        if (!state.soundEnabled) return;
        try {
            if (type === 'win') {
                var audio = new Audio('victory.mp4');
                audio.volume = 0.5;
                audio.play().catch(function() {});
                return;
            }
            var ctx = new (window.AudioContext || window.webkitAudioContext)();
            var osc = ctx.createOscillator();
            var gain = ctx.createGain();
            osc.connect(gain);
            gain.connect(ctx.destination);
            gain.gain.value = 0.1;
            switch(type) {
                case 'click':
                    osc.frequency.value = 440;
                    osc.start();
                    osc.stop(ctx.currentTime + 0.05);
                    break;
                case 'eliminate':
                    osc.frequency.value = 660;
                    gain.gain.value = 0.15;
                    osc.start();
                    osc.stop(ctx.currentTime + 0.15);
                    break;
                case 'fail':
                    osc.frequency.value = 200;
                    osc.type = 'sawtooth';
                    gain.gain.value = 0.1;
                    osc.start();
                    osc.stop(ctx.currentTime + 0.3);
                    break;
            }
        } catch(e) {}
    }

    function updateSoundToggle() {
        $.toggleSound.classList.toggle('active', state.soundEnabled);
    }

    function toggleSound() {
        state.soundEnabled = !state.soundEnabled;
        updateSoundToggle();
        saveSettings();
        if (state.soundEnabled) playSound('click');
    }

    function showScreen(name) {
        $.mainMenu.style.display = 'none';
        $.gameScreen.style.display = 'none';
        $.winModal.classList.remove('active');
        $.failModal.classList.remove('active');
        $.settingsModal.classList.remove('active');
        if (name === 'menu') $.mainMenu.style.display = 'flex';
        else if (name === 'game') $.gameScreen.style.display = 'flex';
        else if (name === 'win') { $.mainMenu.style.display = 'flex'; $.winModal.classList.add('active'); }
        else if (name === 'fail') { $.mainMenu.style.display = 'flex'; $.failModal.classList.add('active'); }
    }

    function showSettings() { $.settingsModal.classList.add('active'); }
    function hideSettings() { $.settingsModal.classList.remove('active'); }

    function getTotalCards(levelConfig) {
        var total = 0;
        levelConfig.layers.forEach(function(layoutId) {
            var layout = LAYOUT_CONFIG[layoutId];
            if (layout) total += layout.layout.length;
        });
        return total;
    }

    function buildTypePool(totalCards, typeCount) {
        var pool = [];
        var counts = [];
        for (var t = 0; t < typeCount; t++) {
            for (var i = 0; i < 3; i++) pool.push(t);
            counts[t] = 3;
        }
        var remaining = totalCards - pool.length;
        var maxPerType = Math.ceil(totalCards / typeCount / 3);
        while (remaining > 0) {
            for (var t = 0; t < typeCount && remaining > 0; t++) {
                if (counts[t] < maxPerType * 3) {
                    pool.push(t);
                    counts[t]++;
                    remaining--;
                }
            }
        }
        for (var i = pool.length - 1; i > 0; i--) {
            var j = Math.floor(Math.random() * (i + 1));
            var tmp = pool[i]; pool[i] = pool[j]; pool[j] = tmp;
        }
        return pool;
    }

    function rectIntersects(r1, r2) {
        return !(r1.x + r1.width <= r2.x || r2.x + r2.width <= r1.x ||
                 r1.y + r1.height <= r2.y || r2.y + r2.height <= r1.y);
    }

    function generateLevel(levelNum, difficulty) {
        var levelConfig = LEVEL_CONFIG[levelNum];
        if (!levelConfig) levelConfig = LEVEL_CONFIG[1];
        var totalCards = getTotalCards(levelConfig);
        var typePool = buildTypePool(totalCards, 12);
        var typeIndex = 0;
        var allCards = [];
        var layerIndex = 0;

        levelConfig.layers.forEach(function(layoutId) {
            var layout = LAYOUT_CONFIG[layoutId];
            if (!layout) return;
            var layerCards = [];
            layout.layout.forEach(function(pos) {
                var card = {
                    layerIndex: layerIndex,
                    x: pos.X,
                    y: pos.Y,
                    type: typePool[typeIndex++],
                    status: STATUS.DISABLE,
                    area: AREA.OPERATION,
                    beforeGrids: [],
                    afterGrids: []
                };
                layerCards.push(card);
            });
            allCards.push(layerCards);
            layerIndex++;
        });

        // 计算前后置关系
        for (var li = allCards.length - 1; li >= 0; li--) {
            var upperLayer = allCards[li];
            if (!upperLayer) continue;
            for (var ui = 0; ui < upperLayer.length; ui++) {
                var upperCard = upperLayer[ui];
                for (var lj = li - 1; lj >= 0; lj--) {
                    var lowerLayer = allCards[lj];
                    if (!lowerLayer) continue;
                    for (var lj2 = 0; lj2 < lowerLayer.length; lj2++) {
                        var lowerCard = lowerLayer[lj2];
                        var r1 = { x: upperCard.x, y: upperCard.y, width: TILE_WIDTH, height: TILE_HEIGHT };
                        var r2 = { x: lowerCard.x, y: lowerCard.y, width: TILE_WIDTH, height: TILE_HEIGHT };
                        if (rectIntersects(r1, r2)) {
                            if (upperCard.beforeGrids.indexOf(lowerCard) === -1) upperCard.beforeGrids.push(lowerCard);
                            if (lowerCard.afterGrids.indexOf(upperCard) === -1) lowerCard.afterGrids.push(upperCard);
                        }
                    }
                }
            }
        }

        // 初始化可用状态
        for (var li = 0; li < allCards.length; li++) {
            var layer = allCards[li];
            if (!layer) continue;
            for (var gi = 0; gi < layer.length; gi++) {
                var card = layer[gi];
                if (card.beforeGrids.length === 0) card.status = STATUS.ENABLE;
            }
        }

        return allCards;
    }

    function moveToCollection(card) {
        if (!card || card.area === AREA.COLLECTION) return [];
        card.area = AREA.COLLECTION;
        var changeStatus = [];
        var afterGrids = card.afterGrids;
        if (!afterGrids || afterGrids.length === 0) return changeStatus;
        for (var i = 0; i < afterGrids.length; i++) {
            var afterCard = afterGrids[i];
            if (afterCard.status === STATUS.DISABLE) {
                var canEnable = true;
                for (var j = 0; j < afterCard.beforeGrids.length; j++) {
                    if (afterCard.beforeGrids[j].area === AREA.OPERATION) { canEnable = false; break; }
                }
                if (canEnable) { afterCard.status = STATUS.ENABLE; changeStatus.push(afterCard); }
            }
        }
        return changeStatus;
    }

    function moveToInvalid(card) {
        if (!card || card.area === AREA.INVALID) return;
        card.area = AREA.INVALID;
    }

    function startGame() {
        state.isPlaying = true;
        state.propCount = 3;
        state.shuffleCount = 3;
        state.collect = [];
        state.startTime = Date.now();
        $.propCount.textContent = state.propCount;
        $.shuffleCount.textContent = state.shuffleCount;
        $.btnProp.disabled = false;
        $.btnShuffle.disabled = false;
        state.cards = generateLevel(state.level, state.difficulty);
        renderGame();
        showScreen('game');
        playSound('click');
    }

    function restartLevel() {
        hideSettings();
        $.winModal.classList.remove('active');
        $.failModal.classList.remove('active');
        startGame();
    }

    function nextLevel() {
        state.level++;
        if (state.level > 3) state.level = 1;
        hideSettings();
        $.winModal.classList.remove('active');
        startGame();
    }

    function backToMenu() {
        state.isPlaying = false;
        showScreen('menu');
        loadStats();
        playSound('click');
    }

    function giveUp() {
        state.isPlaying = false;
        saveStats(false);
        showScreen('fail');
        playSound('fail');
    }

    function renderGame() {
        $.mapContainer.innerHTML = '';
        $.collectGrid.innerHTML = '';

        // 渲染收集区格子
        for (var i = 0; i < COLLECT_SIZE; i++) {
            var slot = document.createElement('div');
            slot.className = 'collect-slot';
            $.collectGrid.appendChild(slot);
        }

        // 渲染卡片 - 反转遍历顺序，让格子多的层后渲染（在上层）
        for (var li = state.cards.length - 1; li >= 0; li--) {
            var layerCards = state.cards[li];
            if (!layerCards) continue;

            for (var gi = 0; gi < layerCards.length; gi++) {
                var card = layerCards[gi];
                if (card.area === AREA.INVALID) continue;

                var tile = document.createElement('div');
                tile.className = 'tile';
                tile.style.left = card.x + 'px';
                tile.style.top = card.y + 'px';
                tile.style.position = 'absolute';

                var img = document.createElement('img');
                img.src = 'elgee-assets/Group ' + (card.type + 1) + '.png';
                tile.appendChild(img);

                if (card.status === STATUS.DISABLE) {
                    tile.classList.add('disabled');
                } else {
                    (function(c) {
                        tile.addEventListener('click', function() { clickTile(c); });
                    })(card);
                }

                $.mapContainer.appendChild(tile);
            }
        }

        // 渲染收集区
        for (var i = 0; i < state.collect.length; i++) {
            var item = state.collect[i];
            var slot = $.collectGrid.children[i];
            if (slot && item) {
                var tile = document.createElement('div');
                tile.className = 'tile';
                var img = document.createElement('img');
                img.src = 'elgee-assets/Group ' + (item.type + 1) + '.png';
                tile.appendChild(img);
                slot.appendChild(tile);
            }
        }
    }

    function clickTile(card) {
        if (!state.isPlaying) return;
        if (state.collect.length >= COLLECT_SIZE) return;
        if (card.status !== STATUS.ENABLE) return;
        playSound('click');
        var clickedType = card.type;
        moveToCollection(card);
        moveToInvalid(card);
        state.collect.push({ type: clickedType });
        updateCardStatus();
        renderGame();
        setTimeout(checkEliminate, 100);
    }

    function updateCardStatus() {
        for (var li = 0; li < state.cards.length; li++) {
            var layer = state.cards[li];
            if (!layer) continue;
            for (var gi = 0; gi < layer.length; gi++) {
                var card = layer[gi];
                if (card.area !== AREA.OPERATION) continue;
                if (card.beforeGrids.length === 0) {
                    card.status = STATUS.ENABLE;
                } else {
                    var allRemoved = true;
                    for (var i = 0; i < card.beforeGrids.length; i++) {
                        if (card.beforeGrids[i].area !== AREA.INVALID) { allRemoved = false; break; }
                    }
                    card.status = allRemoved ? STATUS.ENABLE : STATUS.DISABLE;
                }
            }
        }
    }

    function checkEliminate() {
        var typeCount = {};
        state.collect.forEach(function(item) {
            if (item) typeCount[item.type] = (typeCount[item.type] || 0) + 1;
        });
        var canEliminate = Object.keys(typeCount).filter(function(type) { return typeCount[type] >= ELIMINATE_COUNT; });
        if (canEliminate.length > 0) {
            var indexes = [];
            var eliminated = 0;
            for (var i = 0; i < state.collect.length && eliminated < ELIMINATE_COUNT; i++) {
                if (canEliminate.indexOf(state.collect[i].type.toString()) >= 0) { indexes.push(i); eliminated++; }
            }
            playSound('eliminate');
            indexes.forEach(function(idx) {
                var slot = $.collectGrid.children[idx];
                var tile = slot.querySelector('.tile');
                if (tile) tile.classList.add('eliminating');
            });
            setTimeout(function() {
                indexes.forEach(function(idx) {
                    var item = state.collect[idx];
                    for (var li = 0; li < state.cards.length; li++) {
                        var layer = state.cards[li];
                        if (!layer) continue;
                        for (var gi = 0; gi < layer.length; gi++) {
                            var card = layer[gi];
                            if (card.type === item.type && card.area === AREA.COLLECTION) { moveToInvalid(card); break; }
                        }
                    }
                });
                indexes.reverse().forEach(function(idx) { state.collect.splice(idx, 1); });
                renderGame();
                setTimeout(function() { checkEliminate(); checkWin(); }, 50);
            }, 300);
        } else {
            checkFail();
        }
    }

    function checkWin() {
        var remaining = 0;
        for (var li = 0; li < state.cards.length; li++) {
            var layer = state.cards[li];
            if (!layer) continue;
            for (var gi = 0; gi < layer.length; gi++) {
                if (layer[gi].area !== AREA.INVALID) remaining++;
            }
        }
        if (remaining === 0 && state.collect.length === 0) {
            state.isPlaying = false;
            saveStats(true);
            var elapsed = Math.floor((Date.now() - state.startTime) / 1000);
            var m = Math.floor(elapsed / 60);
            var s = elapsed % 60;
            $.winTime.textContent = '用时：' + (m < 10 ? '0' : '') + m + ':' + (s < 10 ? '0' : '') + s;
            $.winLevel.textContent = '第' + state.level + '关';
            showScreen('win');
            playSound('win');
        }
    }

    function checkFail() {
        if (state.collect.length >= COLLECT_SIZE) {
            var typeCount = {};
            state.collect.forEach(function(item) { if (item) typeCount[item.type] = (typeCount[item.type] || 0) + 1; });
            var canEliminate = Object.values(typeCount).some(function(c) { return c >= ELIMINATE_COUNT; });
            if (!canEliminate) {
                state.isPlaying = false;
                saveStats(false);
                showScreen('fail');
                playSound('fail');
            }
        }
    }

    function useProp() {
        if (!state.isPlaying || state.propCount <= 0 || state.collect.length < 3) return;
        playSound('click');
        state.propCount--;
        $.propCount.textContent = state.propCount;
        $.btnProp.disabled = state.propCount <= 0;
        var indexes = [];
        for (var i = 0; i < state.collect.length && indexes.length < 3; i++) { if (state.collect[i]) indexes.push(i); }
        indexes.forEach(function(idx) {
            var slot = $.collectGrid.children[idx];
            var tile = slot.querySelector('.tile');
            if (tile) tile.classList.add('eliminating');
        });
        setTimeout(function() {
            indexes.forEach(function(idx) {
                var item = state.collect[idx];
                for (var li = 0; li < state.cards.length; li++) {
                    var layer = state.cards[li];
                    if (!layer) continue;
                    for (var gi = 0; gi < layer.length; gi++) {
                        var card = layer[gi];
                        if (card.type === item.type && card.area === AREA.COLLECTION) { moveToInvalid(card); break; }
                    }
                }
            });
            indexes.reverse().forEach(function(idx) { state.collect.splice(idx, 1); });
            renderGame();
            checkWin();
        }, 300);
    }

    function useShuffle() {
        if (!state.isPlaying || state.shuffleCount <= 0) return;
        playSound('click');
        state.shuffleCount--;
        $.shuffleCount.textContent = state.shuffleCount;
        $.btnShuffle.disabled = state.shuffleCount <= 0;
        // 打乱收集区的棋子顺序
        for (var i = state.collect.length - 1; i > 0; i--) {
            var j = Math.floor(Math.random() * (i + 1));
            var temp = state.collect[i];
            state.collect[i] = state.collect[j];
            state.collect[j] = temp;
        }
        renderGame();
    }

    if (document.readyState === 'loading') {
        document.addEventListener('DOMContentLoaded', init);
    } else {
        init();
    }
})();
