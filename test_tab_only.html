<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Test Tab Structure</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; }
    .tab-btn { color: #6b7280; border-bottom: 2px solid transparent; transition: all 0.2s; }
    .tab-btn:hover { color: #987341; }
    .tab-btn.active { color: #987341; border-bottom-color: #987341; }
    .iframe-wrap { display: none !important; }
    .iframe-wrap.active { display: block !important; }
  </style>
</head>
<body class="bg-gray-100 min-h-screen">
  <div class="max-w-6xl mx-auto px-4 bg-white border-b border-gray-200 mt-4">
    <div class="flex gap-6">
      <button class="tab-btn py-3 text-sm font-medium" onclick="switchTab('tab1', this)">Tab 1</button>
      <button class="tab-btn py-3 text-sm font-medium" onclick="switchTab('tab2', this)">Tab 2 (预流失用户体验)</button>
    </div>
  </div>

  <div class="max-w-6xl mx-auto px-4 py-6">
    <div id="tab1" class="iframe-wrap space-y-6">
      <div class="bg-white rounded-xl shadow-sm p-6">
        <h2 class="text-xl font-bold">Tab 1 Content</h2>
        <p>这是 Tab 1 的内容</p>
      </div>
    </div>

    <div id="tab2" class="iframe-wrap space-y-6">
      <div class="bg-gradient-to-r from-amber-50 to-orange-50 rounded-xl shadow-sm p-6 border-l-4 border-amber-400">
        <h2 class="text-xl font-bold text-gray-800 mb-4">预流失用户的核心矛盾</h2>
        <div class="flex items-center justify-center gap-8 py-6">
          <div class="text-center">
            <div class="text-5xl mb-2">🎮</div>
            <div class="text-2xl font-bold text-amber-700">还在玩</div>
            <p class="text-sm text-gray-500 mt-1">他们没有完全流失</p>
          </div>
          <div class="text-3xl text-gray-400">→</div>
          <div class="text-center">
            <div class="text-5xl mb-2">😢</div>
            <div class="text-2xl font-bold text-red-600">即将流失</div>
            <p class="text-sm text-gray-500 mt-1">如不干预，将彻底流失</p>
          </div>
        </div>
      </div>

      <div class="bg-white rounded-xl shadow-sm p-6">
        <h3 class="font-bold text-lg mb-4">三体验模块</h3>
        <div class="grid grid-cols-1 md:grid-cols-3 gap-6">
          <div class="border-2 border-amber-300 rounded-xl p-5 bg-amber-50">
            <div class="text-2xl mb-2">🎯</div>
            <h4 class="font-bold text-amber-800">模式体验</h4>
            <p class="text-sm text-gray-600 mt-2">给用户新鲜感，打破疲惫感</p>
          </div>
          <div class="border-2 border-green-300 rounded-xl p-5 bg-green-50">
            <div class="text-2xl mb-2">🏆</div>
            <h4 class="font-bold text-green-800">目标体验</h4>
            <p class="text-sm text-gray-600 mt-2">帮助用户重新找到目标感</p>
          </div>
          <div class="border-2 border-blue-300 rounded-xl p-5 bg-blue-50">
            <div class="text-2xl mb-2">👥</div>
            <h4 class="font-bold text-blue-800">社交体验</h4>
            <p class="text-sm text-gray-600 mt-2">通过社交羁绊留住用户</p>
          </div>
        </div>
      </div>
    </div>
  </div>

  <script>
    function switchTab(tabId, btn) {
      document.querySelectorAll('.iframe-wrap').forEach(el => el.classList.remove('active'));
      document.querySelectorAll('.tab-btn').forEach(el => el.classList.remove('active'));
      const targetTab = document.getElementById('tab-' + tabId);
      if (targetTab) {
        targetTab.classList.add('active');
        btn.classList.add('active');
      }
    }
  </script>
</body>
</html>
