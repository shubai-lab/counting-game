<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>原型E：沉浸展示式</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { font-family: -apple-system, BlinkMacSystemFont, sans-serif; background: #1a1a2e; min-height: 100vh; display: flex; justify-content: center; align-items: center; padding: 20px; }
    .phone-frame { width: 1334px; height: 750px; background: linear-gradient(180deg, #3c271c, #6a3c22); border-radius: 40px; overflow: hidden; position: relative; box-shadow: 0 20px 60px rgba(0,0,0,0.5); }

    .layout-tag { position: absolute; top: 15px; right: 15px; background: rgba(0,0,0,0.5); color: #fff; padding: 8px 16px; border-radius: 8px; font-size: 14px; z-index: 100; }

    /* 沉浸展示布局 */
    .immersive { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; }

    /* 顶部标题 */
    .top-header { padding: 35px 50px; text-align: center; width: 100%; }
    .header-title { font-size: 40px; color: #ead0a3; font-weight: bold; }
    .header-sub { font-size: 20px; color: #ead0a3; opacity: 0.6; margin-top: 6px; }

    /* 圆形进度 */
    .circle-progress { display: flex; justify-content: center; gap: 30px; margin-bottom: 30px; }
    .circle-item { display: flex; flex-direction: column; align-items: center; }
    .circle { width: 70px; height: 70px; border-radius: 50%; background: rgba(255,255,255,0.1); border: 4px solid rgba(234,208,163,0.4); display: flex; align-items: center; justify-content: center; font-size: 28px; color: rgba(234,208,163,0.4); font-weight: bold; }
    .circle-item.active .circle { background: #ead0a3; border-color: #ead0a3; color: #3c271c; box-shadow: 0 0 25px rgba(234,208,163,0.5); }
    .circle-label { font-size: 16px; color: #ead0a3; opacity: 0.5; margin-top: 8px; }
    .circle-item.active .circle-label { opacity: 1; }

    /* 大武将卡 */
    .big-card { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 20px 80px; width: 100%; }
    .showcase { width: 380px; background: linear-gradient(135deg, #ead0a3, #d4c4a3); border-radius: 30px; padding: 35px; text-align: center; border: 5px solid #ead0a3; box-shadow: 0 20px 60px rgba(0,0,0,0.4); }
    .showcase-badge { background: #6a3c22; color: #ead0a3; padding: 8px 20px; border-radius: 20px; font-size: 18px; display: inline-block; margin-bottom: 20px; }
    .showcase-img { font-size: 160px; margin-bottom: 15px; }
    .showcase-name { font-size: 50px; color: #3c271c; font-weight: bold; }
    .showcase-quality { font-size: 24px; color: #6a3c22; margin-top: 8px; }
    .showcase-duration { font-size: 20px; color: #6a3c22; background: rgba(255,255,255,0.5); padding: 10px 25px; border-radius: 20px; display: inline-block; margin-top: 15px; }

    /* 底部预览 */
    .bottom-preview { padding: 0 60px 30px; width: 100%; }
    .preview-label { font-size: 18px; color: #ead0a3; opacity: 0.6; margin-bottom: 12px; }
    .preview-row { display: flex; gap: 20px; }
    .preview-item { flex: 1; background: rgba(255,255,255,0.1); border-radius: 16px; padding: 18px; display: flex; align-items: center; gap: 15px; border: 1px solid rgba(234,208,163,0.3); }
    .preview-icon { width: 50px; height: 65px; background: rgba(234,208,163,0.2); border-radius: 10px; display: flex; align-items: center; justify-content: center; font-size: 30px; }
    .preview-text {}
    .preview-day { font-size: 14px; color: #ead0a3; opacity: 0.6; }
    .preview-name { font-size: 22px; color: #ead0a3; font-weight: bold; margin-top: 4px; }

    /* 任务条 */
    .task-bar { padding: 0 60px; margin-bottom: 25px; }
    .task-row { background: rgba(255,255,255,0.1); border-radius: 16px; padding: 20px 25px; display: flex; align-items: center; justify-content: space-between; }
    .task-info { display: flex; align-items: center; gap: 15px; }
    .task-icon { font-size: 28px; }
    .task-text { font-size: 24px; color: #ead0a3; }
    .task-btn { padding: 12px 25px; background: #ead0a3; color: #3c271c; border-radius: 12px; font-size: 18px; font-weight: bold; border: none; cursor: pointer; }

    /* 底部按钮 */
    .bottom-action { padding: 0 60px 45px; }
    .main-btn { width: 100%; padding: 24px; background: linear-gradient(180deg, #ead0a3, #d4c4a3); color: #3c271c; border-radius: 18px; font-size: 34px; font-weight: bold; border: 3px solid #ead0a3; cursor: pointer; }
  </style>
</head>
<body>
  <div class="phone-frame">
    <div class="layout-tag">原型E：沉浸展示式</div>

    <div class="immersive">
      <div class="top-header">
        <div class="header-title">武将体验卡</div>
        <div class="header-sub">预流失召回 · 连续3日领取</div>
      </div>

      <div class="circle-progress">
        <div class="circle-item active">
          <div class="circle">1</div>
          <div class="circle-label">Day</div>
        </div>
        <div class="circle-item">
          <div class="circle">2</div>
          <div class="circle-label">Day</div>
        </div>
        <div class="circle-item">
          <div class="circle">3</div>
          <div class="circle-label">Day</div>
        </div>
      </div>

      <div class="big-card">
        <div class="showcase">
          <div class="showcase-badge">今日可领取</div>
          <div class="showcase-img">🎴</div>
          <div class="showcase-name">界钟会</div>
          <div class="showcase-quality">传说品质</div>
          <div class="showcase-duration">有效期：7天</div>
        </div>
      </div>

      <div class="bottom-preview">
        <div class="preview-label">明日预告</div>
        <div class="preview-row">
          <div class="preview-item">
            <div class="preview-icon">🎴</div>
            <div class="preview-text">
              <div class="preview-day">Day 2</div>
              <div class="preview-name">尹夫人</div>
            </div>
          </div>
          <div class="preview-item">
            <div class="preview-icon">🎴</div>
            <div class="preview-text">
              <div class="preview-day">Day 3</div>
              <div class="preview-name">牛辅</div>
            </div>
          </div>
        </div>
      </div>

      <div class="task-bar">
        <div class="task-row">
          <div class="task-info">
            <div class="task-icon">🎮</div>
            <div class="task-text">完成任意对局1次</div>
          </div>
          <button class="task-btn">去完成</button>
        </div>
      </div>

      <div class="bottom-action">
        <button class="main-btn">领取武将卡</button>
      </div>
    </div>
  </div>
</body>
</html>
