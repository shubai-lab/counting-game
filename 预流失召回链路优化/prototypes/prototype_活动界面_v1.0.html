<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>预流失召回 - 武将体验卡</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { font-family: -apple-system, BlinkMacSystemFont, sans-serif; background: #1a1a2e; min-height: 100vh; display: flex; justify-content: center; align-items: center; padding: 20px; }

    .phone-frame { width: 1334px; height: 750px; background: linear-gradient(180deg, #3c271c, #6a3c22); border-radius: 40px; overflow: hidden; position: relative; box-shadow: 0 20px 60px rgba(0,0,0,0.5); }

    .fullscreen { position: absolute; inset: 0; display: flex; flex-direction: column; }

    .top-section { padding: 40px 50px 30px; text-align: center; }
    .main-title { font-size: 48px; color: #ead0a3; font-weight: bold; margin-bottom: 8px; }
    .sub-title { font-size: 24px; color: #ead0a3; opacity: 0.7; }

    .progress-section { display: flex; justify-content: center; gap: 40px; margin-bottom: 30px; }
    .day-badge { width: 90px; height: 90px; border-radius: 50%; background: rgba(255,255,255,0.1); border: 3px solid #ead0a3; display: flex; flex-direction: column; align-items: center; justify-content: center; color: #ead0a3; opacity: 0.5; transition: all 0.3s; }
    .day-badge.active { background: #ead0a3; color: #3c271c; opacity: 1; box-shadow: 0 0 20px rgba(234,208,163,0.5); }
    .day-badge.done { background: rgba(234,208,163,0.3); opacity: 0.7; }
    .day-badge span:first-child { font-size: 32px; font-weight: bold; }
    .day-badge span:last-child { font-size: 14px; }

    .hero-section { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 0 50px; }

    .hero-card-main { width: 450px; background: linear-gradient(135deg, rgba(234,208,163,0.95), rgba(212,196,163,0.95)); border-radius: 30px; padding: 40px; text-align: center; border: 4px solid #ead0a3; box-shadow: 0 15px 50px rgba(0,0,0,0.3); position: relative; }
    .hero-card-main::before { content: '今日可领取'; position: absolute; top: -15px; left: 50%; transform: translateX(-50%); background: #6a3c22; color: #ead0a3; padding: 8px 25px; border-radius: 20px; font-size: 18px; }

    .hero-avatar { font-size: 160px; margin-bottom: 20px; }
    .hero-name { font-size: 52px; color: #3c271c; font-weight: bold; margin-bottom: 10px; }
    .hero-quality { font-size: 26px; color: #6a3c22; margin-bottom: 15px; }
    .hero-duration { font-size: 22px; color: #6a3c22; background: rgba(255,255,255,0.5); padding: 12px 30px; border-radius: 25px; display: inline-block; }

    .hero-preview { display: flex; justify-content: center; gap: 30px; margin-top: 25px; }
    .preview-card { width: 120px; background: rgba(255,255,255,0.15); border-radius: 16px; padding: 15px; text-align: center; border: 2px solid rgba(234,208,163,0.5); }
    .preview-day { font-size: 16px; color: #ead0a3; opacity: 0.7; margin-bottom: 8px; }
    .preview-icon { font-size: 50px; margin-bottom: 5px; }
    .preview-name { font-size: 18px; color: #ead0a3; }

    .task-section { padding: 30px 50px; }
    .task-list { background: rgba(255,255,255,0.1); border-radius: 20px; overflow: hidden; }
    .task-item { display: flex; align-items: center; justify-content: space-between; padding: 22px 30px; border-bottom: 1px solid rgba(234,208,163,0.2); }
    .task-item:last-child { border-bottom: none; }
    .task-left { display: flex; align-items: center; gap: 20px; }
    .task-icon { width: 55px; height: 55px; background: rgba(255,255,255,0.1); border-radius: 12px; display: flex; align-items: center; justify-content: center; font-size: 28px; }
    .task-name { font-size: 26px; color: #ead0a3; font-weight: bold; }
    .task-status { font-size: 18px; color: #ead0a3; opacity: 0.6; margin-top: 4px; }
    .task-badge { padding: 10px 22px; border-radius: 20px; font-size: 20px; font-weight: bold; cursor: pointer; border: none; }
    .task-badge.done { background: rgba(234,208,163,0.3); color: #ead0a3; }
    .task-badge.pending { background: #ead0a3; color: #3c271c; }
    .task-badge.action { background: #ead0a3; color: #3c271c; }

    .bottom-section { padding: 30px 50px 50px; }
    .claim-btn { width: 100%; padding: 25px; background: linear-gradient(180deg, #ead0a3, #d4c4a3); color: #3c271c; border-radius: 20px; font-size: 36px; font-weight: bold; cursor: pointer; border: 3px solid #ead0a3; transition: all 0.2s; }
    .claim-btn:hover { transform: scale(1.02); box-shadow: 0 10px 30px rgba(234,208,163,0.4); }
    .claim-btn:disabled { background: rgba(234,208,163,0.3); color: rgba(60,39,28,0.5); cursor: not-allowed; transform: none; box-shadow: none; }

    .success-overlay { position: absolute; inset: 0; background: rgba(0,0,0,0.8); display: flex; flex-direction: column; align-items: center; justify-content: center; opacity: 0; pointer-events: none; transition: opacity 0.3s; }
    .success-overlay.show { opacity: 1; pointer-events: auto; }
    .success-icon { font-size: 150px; animation: bounce 0.5s ease; }
    .success-text { font-size: 48px; color: #ead0a3; font-weight: bold; margin-top: 20px; }
    .success-sub { font-size: 24px; color: #ead0a3; opacity: 0.7; margin-top: 10px; }

    @keyframes bounce { 0%, 100% { transform: scale(1); } 50% { transform: scale(1.2); } }

    .layout-tag { position: absolute; top: 15px; right: 15px; background: rgba(0,0,0,0.5); color: #fff; padding: 8px 16px; border-radius: 8px; font-size: 14px; z-index: 100; }
  </style>
</head>
<body>
  <div class="phone-frame">
    <div class="layout-tag">全屏布局-无Tab | 沉浸式全屏</div>

    <div class="fullscreen">
      <div class="top-section">
        <div class="main-title">武将体验卡</div>
        <div class="sub-title">预流失召回 · 连续3日领取</div>
      </div>

      <div class="progress-section">
        <div class="day-badge active" id="day1">
          <span>1</span>
          <span>Day</span>
        </div>
        <div class="day-badge" id="day2">
          <span>2</span>
          <span>Day</span>
        </div>
        <div class="day-badge" id="day3">
          <span>3</span>
          <span>Day</span>
        </div>
      </div>

      <div class="hero-section">
        <div class="hero-card-main">
          <div class="hero-avatar">🎴</div>
          <div class="hero-name">界钟会</div>
          <div class="hero-quality">传说品质</div>
          <div class="hero-duration">有效期：7天</div>
        </div>

        <div class="hero-preview">
          <div class="preview-card">
            <div class="preview-day">Day 2</div>
            <div class="preview-icon">🎴</div>
            <div class="preview-name">尹夫人</div>
          </div>
          <div class="preview-card">
            <div class="preview-day">Day 3</div>
            <div class="preview-icon">🎴</div>
            <div class="preview-name">牛辅</div>
          </div>
        </div>
      </div>

      <div class="task-section">
        <div class="task-list">
          <div class="task-item">
            <div class="task-left">
              <div class="task-icon">✓</div>
              <div class="task-info">
                <div class="task-name">登录游戏</div>
                <div class="task-status">已完成</div>
              </div>
            </div>
            <div class="task-right">
              <div class="task-badge done">✓</div>
            </div>
          </div>
          <div class="task-item">
            <div class="task-left">
              <div class="task-icon">🎮</div>
              <div class="task-info">
                <div class="task-name">完成任意对局1次</div>
                <div class="task-status">进行中</div>
              </div>
            </div>
            <div class="task-right">
              <button class="task-badge action" onclick="completeTask()">去完成</button>
            </div>
          </div>
        </div>
      </div>

      <div class="bottom-section">
        <button class="claim-btn" id="claimBtn" onclick="claimCard()">领取武将卡</button>
      </div>
    </div>

    <div class="success-overlay" id="successOverlay">
      <div class="success-icon">✓</div>
      <div class="success-text">领取成功！</div>
      <div class="success-sub">武将卡已发放至背包</div>
    </div>
  </div>

  <script>
    let taskCompleted = false;

    function completeTask() {
      taskCompleted = true;
      const taskItem = document.querySelector('.task-item:last-child');
      taskItem.querySelector('.task-status').textContent = '已完成';
      taskItem.querySelector('.task-badge').textContent = '✓';
      taskItem.querySelector('.task-badge').className = 'task-badge done';
      document.getElementById('claimBtn').disabled = false;
      alert('任务完成！可领取武将卡');
    }

    function claimCard() {
      if (!taskCompleted) {
        alert('请先完成任务');
        return;
      }
      const overlay = document.getElementById('successOverlay');
      overlay.classList.add('show');
      setTimeout(() => {
        overlay.classList.remove('show');
        document.getElementById('claimBtn').textContent = '已领取';
        document.getElementById('claimBtn').disabled = true;
      }, 2000);
    }

    document.getElementById('claimBtn').disabled = true;
  </script>
</body>
</html>
