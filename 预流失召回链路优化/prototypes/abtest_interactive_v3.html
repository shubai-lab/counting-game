<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>预流失ABTest 动态交互</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    .font-kai { font-family: 'FZShengShiKaiShuS-DB-GB', 'FZBeiWeiKaiShu-S19_GBK', serif; }
    .font-inter { font-family: 'Inter', sans-serif; }

    /* 横屏手机框架 - 1334x750 */
    .phone-frame {
      width: 750px;
      height: 422px;
      border-radius: 20px;
      background: #1a1a2e;
      padding: 8px;
      box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
    }
    .phone-screen {
      width: 100%;
      height: 100%;
      border-radius: 14px;
      background: #fff9f0;
      overflow: hidden;
    }

    .tab-btn {
      padding: 12px 24px;
      border-radius: 8px;
      transition: all 0.2s;
    }
    .tab-btn.active {
      background: linear-gradient(180deg, #ead0a3 0%, #d4b88a 100%);
      color: #6a3c22;
    }
    .tab-btn:not(.active) {
      background: rgba(255,255,255,0.1);
      color: #999;
    }

    .state-btn {
      padding: 8px 16px;
      border-radius: 16px;
      font-size: 14px;
      transition: all 0.2s;
    }
    .state-btn.active {
      background: #ead0a3;
      color: #6a3c22;
    }
    .state-btn:not(.active) {
      background: rgba(255,255,255,0.1);
      color: #777;
    }

    @keyframes fadeIn {
      from { opacity: 0; }
      to { opacity: 1; }
    }
    .animate-fade-in { animation: fadeIn 0.3s ease-out; }

    /* 预览图片容器 - 横屏适配 */
    .preview-container {
      width: 100%;
      height: 100%;
      overflow: auto;
      background: #2a2a3e;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .preview-container img {
      max-width: 100%;
      max-height: 100%;
      width: auto;
      height: auto;
      object-fit: contain;
    }

    /* 全屏预览模式 */
    .fullscreen-modal {
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.95);
      z-index: 100;
      display: none;
      justify-content: center;
      align-items: center;
      padding: 20px;
    }
    .fullscreen-modal.active {
      display: flex;
    }
    .fullscreen-modal img {
      max-width: 100%;
      max-height: 100%;
      object-fit: contain;
    }
  </style>
</head>
<body class="bg-gray-900 min-h-screen py-8">

  <div class="max-w-6xl mx-auto">
    <h1 class="text-center text-2xl font-kai text-amber-400 mb-2">预流失ABTest 动态交互</h1>
    <p class="text-center text-gray-400 mb-8 font-inter text-sm">基于Figma设计稿 · 点击Tab切换方案 · 点击图片可全屏查看</p>

    <!-- Tab 切换 -->
    <div class="flex justify-center gap-4 mb-8">
      <button class="tab-btn active font-kai" onclick="switchTab('a')">Test A<br><span class="text-xs font-inter">武将体验推送</span></button>
      <button class="tab-btn font-kai" onclick="switchTab('b')">Test B<br><span class="text-xs font-inter">限时挑战</span></button>
      <button class="tab-btn font-kai" onclick="switchTab('c')">Test C<br><span class="text-xs font-inter">奇遇包装</span></button>
    </div>

    <div class="grid grid-cols-1 xl:grid-cols-3 gap-8 items-center justify-items-center">

      <!-- 手机预览 -->
      <div class="relative">
        <!-- 全屏按钮 -->
        <button onclick="toggleFullscreen()" class="absolute top-2 right-2 z-10 bg-black/50 text-white px-3 py-1 rounded text-sm hover:bg-black/70">
          🔍 全屏
        </button>
        <div class="phone-frame animate-fade-in" id="phone-frame">
          <div class="phone-screen">
            <div class="preview-container" id="preview-container">
              <img id="preview-img" src="test a.png" alt="预览" onclick="toggleFullscreen()" style="cursor: zoom-in;">
            </div>
          </div>
        </div>
      </div>

      <!-- 状态切换 - 右侧 -->
      <div class="bg-gray-800 rounded-2xl p-6 min-w-[400px]">
        <h3 class="font-kai text-white text-xl mb-4">状态切换</h3>

        <div id="state-a" class="space-y-4">
          <div class="font-inter text-gray-400 text-sm mb-2">Test A：武将体验推送</div>
          <div class="flex flex-wrap gap-2">
            <button class="state-btn active" onclick="switchState('a')">推送弹窗</button>
            <button class="state-btn" onclick="switchState('a')">已领取</button>
            <button class="state-btn" onclick="switchState('a')">对局中</button>
            <button class="state-btn" onclick="switchState('a')">对局结果</button>
          </div>
        </div>

        <div id="state-b" class="space-y-4 hidden">
          <div class="font-inter text-gray-400 text-sm mb-2">Test B：限时挑战</div>
          <div class="flex flex-wrap gap-2">
            <button class="state-btn active" onclick="switchState('b')">挑战弹窗</button>
            <button class="state-btn" onclick="switchState('b')">进行中</button>
            <button class="state-btn" onclick="switchState('b')">已完成</button>
            <button class="state-btn" onclick="switchState('b')">已中断</button>
          </div>
        </div>

        <div id="state-c" class="space-y-4 hidden">
          <div class="font-inter text-gray-400 text-sm mb-2">Test C：奇遇包装</div>
          <div class="flex flex-wrap gap-2">
            <button class="state-btn active" onclick="switchState('c')">武将来找</button>
            <button class="state-btn" onclick="switchState('c')">武将对话</button>
            <button class="state-btn" onclick="switchState('c')">任务列表</button>
            <button class="state-btn" onclick="switchState('c')">奖励领取</button>
          </div>
        </div>

        <!-- 方案说明 -->
        <div class="bg-gray-700 rounded-lg p-4 mt-4">
          <div class="text-amber-400 text-sm font-semibold mb-2" id="state-title">💡 方案说明</div>
          <div class="text-gray-300 text-sm leading-relaxed" id="state-desc">
            <p><strong>核心逻辑：</strong>系统直接推送武将体验卡给预流失用户</p>
            <p class="mt-2"><strong>触发时机：</strong>用户进入游戏时弹窗展示</p>
            <p class="mt-2"><strong>体验优势：</strong>胜率+15%，100%出现在推将列表</p>
          </div>
        </div>

        <!-- 差异对比 -->
        <div class="mt-6 pt-6 border-t border-gray-700">
          <h4 class="text-white font-kai text-lg mb-3">三种方案核心差异</h4>
          <div class="grid grid-cols-3 gap-3">
            <div class="bg-blue-900/30 rounded-lg p-3 text-center">
              <div class="text-blue-400 font-semibold text-sm">Test A</div>
              <div class="text-gray-400 text-xs mt-1">系统推送</div>
              <div class="text-gray-300 text-xs mt-1">直接简单</div>
            </div>
            <div class="bg-orange-900/30 rounded-lg p-3 text-center">
              <div class="text-orange-400 font-semibold text-sm">Test B</div>
              <div class="text-gray-400 text-xs mt-1">挑战激励</div>
              <div class="text-gray-300 text-xs mt-1">成就驱动</div>
            </div>
            <div class="bg-purple-900/30 rounded-lg p-3 text-center">
              <div class="text-purple-400 font-semibold text-sm">Test C</div>
              <div class="text-gray-400 text-xs mt-1">情感羁绊</div>
              <div class="text-gray-300 text-xs mt-1">武将主动</div>
            </div>
          </div>
        </div>
      </div>

      <!-- 右侧空白或说明 -->
      <div class="text-gray-500 text-center p-8">
        <div class="text-4xl mb-4">📱</div>
        <div class="font-kai text-lg">横屏 1334×750</div>
        <div class="text-sm mt-2">游戏标准界面尺寸</div>
      </div>
    </div>

    <!-- 全屏预览 -->
    <div class="fullscreen-modal" id="fullscreen-modal" onclick="toggleFullscreen()">
      <img id="fullscreen-img" src="" alt="全屏预览">
      <div class="absolute bottom-4 right-4 text-gray-400 text-sm">点击任意处关闭</div>
    </div>

    <!-- 底部说明 -->
    <div class="mt-8 text-center text-gray-500 text-sm">
      <p>图片来源：Figma设计稿「预流失界面调整」</p>
    </div>
  </div>

  <script>
    // 图片路径
    const images = {
      a: 'test a.png',
      b: 'TEST b.png',
      c: 'TEST c.png'
    };

    // Tab切换
    function switchTab(tab) {
      document.querySelectorAll('.tab-btn').forEach(btn => btn.classList.remove('active'));
      event.target.closest('.tab-btn').classList.add('active');

      const img = document.getElementById('preview-img');
      img.src = images[tab];

      const frame = document.getElementById('phone-frame');
      frame.classList.remove('animate-fade-in');
      void frame.offsetWidth;
      frame.classList.add('animate-fade-in');

      document.querySelectorAll('[id^="state-"]').forEach(el => el.classList.add('hidden'));
      document.getElementById('state-' + tab).classList.remove('hidden');
    }

    // 全屏预览切换
    function toggleFullscreen() {
      const modal = document.getElementById('fullscreen-modal');
      const fullscreenImg = document.getElementById('fullscreen-img');
      const previewImg = document.getElementById('preview-img');

      if (modal.classList.contains('active')) {
        modal.classList.remove('active');
      } else {
        fullscreenImg.src = previewImg.src;
        modal.classList.add('active');
      }
    }

    // 状态切换
    function switchState(tab) {
      const container = document.getElementById('state-' + tab);
      container.querySelectorAll('.state-btn').forEach(btn => btn.classList.remove('active'));
      event.target.classList.add('active');
    }
  </script>

</body>
</html>
