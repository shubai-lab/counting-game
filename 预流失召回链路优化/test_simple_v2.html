<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>预流失召回链路 · 简化版测试</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    .page { position: absolute; inset: 0; display: none; }
    .page.active { display: block; animation: fadeIn 0.3s ease; }
    @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
    .btn-hotspot { cursor: pointer; background: rgba(255,0,0,0.3); border: 2px dashed white; }
  </style>
</head>
<body style="background: #111; overflow: hidden;">

<div style="position:relative; width:100vw; height:56.25vw; max-height:100vh; max-width:177.78vh; margin:auto; overflow:hidden;">

  <!-- 页面1: 预流失弹窗 -->
  <div id="page1" class="page active">
    <img src="预流失弹窗.jpg" style="width:100%;height:100%;object-fit:contain;" />
    <div class="btn-hotspot" onclick="showPage(2)" style="bottom:15%;left:28%;width:16%;height:9%;"></div>
  </div>

  <!-- 页面2: 预流失领取界面 -->
  <div id="page2" class="page">
    <img src="预流失领取界面.jpg" style="width:100%;height:100%;object-fit:contain;" />
    <div class="btn-hotspot" onclick="showPage(3)" style="bottom:13%;left:calc(38% + 150px);width:12%;height:6%;"></div>
  </div>

  <!-- 页面3: 领取武将体验卡界面 -->
  <div id="page3" class="page">
    <img src="领取武将体验卡.jpg" style="width:100%;height:100%;object-fit:contain;" />
    <div onclick="showPage(4)" style="position:absolute;inset:0;cursor:pointer;"></div>
  </div>

  <!-- 页面4: 预流失任务界面 -->
  <div id="page4" class="page">
    <img src="预流失任务界面.jpg" style="width:100%;height:100%;object-fit:contain;" />
    <div class="btn-hotspot" onclick="alert('任务界面')" style="top:28%;left:15%;width:70%;height:12%;"></div>
  </div>

</div>

<script>
function showPage(num) {
  console.log('切换到页面', num);
  document.querySelectorAll('.page').forEach(p => p.classList.remove('active'));
  document.getElementById('page' + num).classList.add('active');
}
</script>

</body>
</html>
