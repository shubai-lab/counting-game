<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>布局7：弹窗式布局 - 底部弹窗</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { font-family: -apple-system, BlinkMacSystemFont, sans-serif; background: #1a1a2e; min-height: 100vh; display: flex; justify-content: center; align-items: center; padding: 20px; }
    .phone-frame { width: 1334px; height: 750px; background: #fff9f0; border-radius: 40px; overflow: hidden; position: relative; box-shadow: 0 20px 60px rgba(0,0,0,0.3); }

    /* 背景界面 */
    .bg-layer { position: absolute; inset: 0; background: linear-gradient(180deg, #3c271c, #6a3c22); display: flex; flex-direction: column; align-items: center; justify-content: center; }
    .bg-text { font-size: 32px; color: #ead0a3; opacity: 0.5; }

    /* 顶部导航 */
    .top-bar { position: absolute; top: 0; left: 0; right: 0; height: 80px; background: transparent; display: flex; align-items: center; justify-content: center; }
    .top-title { font-size: 32px; color: #ead0a3; font-weight: bold; }

    /* 底部弹窗 */
    .bottom-sheet { position: absolute; bottom: 0; left: 0; right: 0; background: #fff; border-radius: 30px 30px 0 0; box-shadow: 0 -10px 40px rgba(0,0,0,0.3); max-height: 600px; overflow: hidden; display: flex; flex-direction: column; }

    /* 弹窗头部 */
    .sheet-header { padding: 25px 30px; background: linear-gradient(135deg, #ead0a3, #d4c4a3); display: flex; justify-content: space-between; align-items: center; border-bottom: 2px solid #6a3c22; }
    .sheet-title { font-size: 32px; color: #3c271c; font-weight: bold; }
    .close-btn { width: 50px; height: 50px; background: #6a3c22; color: #ead0a3; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 28px; cursor: pointer; border: none; }

    /* 弹窗内容 */
    .sheet-content { flex: 1; overflow-y: auto; padding: 25px 30px; }

    /* 武将卡大图 */
    .hero-showcase { background: linear-gradient(135deg, #ead0a3, #d4c4a3); border-radius: 20px; padding: 30px; margin-bottom: 20px; display: flex; align-items: center; gap: 30px; border: 2px solid #6a3c22; }
    .hero-img { width: 150px; height: 180px; background: #fff; border-radius: 16px; display: flex; align-items: center; justify-content: center; font-size: 100px; }
    .hero-details { flex: 1; }
    .hero-name { font-size: 36px; color: #3c271c; font-weight: bold; margin-bottom: 10px; }
    .hero-quality { font-size: 22px; color: #6a3c22; margin-bottom: 8px; }
    .hero-duration { font-size: 20px; color: #6a3c22; background: rgba(255,255,255,0.5); padding: 8px 16px; border-radius: 8px; display: inline-block; }

    /* 任务列表 */
    .task-section { margin-bottom: 20px; }
    .section-label { font-size: 24px; color: #3c271c; font-weight: bold; margin-bottom: 15px; }
    .task-row { background: #fff9f0; border-radius: 12px; padding: 18px 20px; margin-bottom: 12px; display: flex; align-items: center; justify-content: space-between; border: 1px solid #ead0a3; }
    .task-info { display: flex; align-items: center; gap: 15px; }
    .task-icon { font-size: 28px; }
    .task-name { font-size: 22px; color: #3c271c; }
    .task-status { font-size: 18px; color: #6a3c22; }
    .task-done { width: 40px; height: 40px; background: #6a3c22; color: #ead0a3; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 24px; }

    /* 弹窗底部 */
    .sheet-footer { padding: 20px 30px; background: #fff; border-top: 2px solid #ead0a3; }
    .action-btn { width: 100%; padding: 20px; background: linear-gradient(180deg, #ead0a3, #d4c4a3); color: #3c271c; border-radius: 16px; font-size: 30px; font-weight: bold; cursor: pointer; border: 3px solid #6a3c22; }

    /* 遮罩 */
    .overlay { position: absolute; inset: 0; background: rgba(0,0,0,0.5); }

    .layout-label { position: absolute; top: 10px; right: 10px; background: rgba(0,0,0,0.7); color: #fff; padding: 8px 16px; border-radius: 8px; font-size: 14px; z-index: 100; }
  </style>
</head>
<body>
  <div class="phone-frame">
    <div class="layout-label">布局7：弹窗式布局 - 底部弹窗（720×450px，屏幕中心）</div>

    <!-- 背景 -->
    <div class="bg-layer">
      <div class="bg-text">点击领取武将体验卡</div>
    </div>

    <!-- 遮罩 -->
    <div class="overlay"></div>

    <!-- 顶部导航 -->
    <div class="top-bar">
      <div class="top-title">武将体验卡</div>
    </div>

    <!-- 底部弹窗 (720×450px 小弹窗) -->
    <div class="bottom-sheet">
      <div class="sheet-header">
        <div class="sheet-title">Day 1 · 武将体验</div>
        <button class="close-btn">×</button>
      </div>

      <div class="sheet-content">
        <!-- 武将展示 -->
        <div class="hero-showcase">
          <div class="hero-img">🎴</div>
          <div class="hero-details">
            <div class="hero-name">界钟会</div>
            <div class="hero-quality">传说品质</div>
            <div class="hero-duration">有效期：7天</div>
          </div>
        </div>

        <!-- 任务 -->
        <div class="task-section">
          <div class="section-label">领取条件</div>
          <div class="task-row">
            <div class="task-info">
              <div class="task-icon">✓</div>
              <div class="task-name">登录游戏</div>
            </div>
            <div class="task-done">✓</div>
          </div>
          <div class="task-row">
            <div class="task-info">
              <div class="task-icon">🎮</div>
              <div class="task-name">完成任意对局1次</div>
            </div>
            <div class="task-status">进行中</div>
          </div>
        </div>
      </div>

      <div class="sheet-footer">
        <button class="action-btn">完成任务后领取</button>
      </div>
    </div>
  </div>
</body>
</html>
