<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>布局4：左右布局 - 右侧局部Tab</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { font-family: -apple-system, BlinkMacSystemFont, sans-serif; background: #1a1a2e; min-height: 100vh; display: flex; justify-content: center; align-items: center; padding: 20px; }
    .phone-frame { width: 1334px; height: 750px; background: #fff9f0; border-radius: 40px; overflow: hidden; position: relative; box-shadow: 0 20px 60px rgba(0,0,0,0.3); }

    /* 顶部标题 */
    .header { height: 80px; background: linear-gradient(180deg, #6a3c22, #3c271c); display: flex; align-items: center; justify-content: center; }
    .header-title { font-size: 32px; color: #ead0a3; font-weight: bold; }

    /* 主内容区 */
    .main-area { position: absolute; top: 80px; left: 0; right: 0; bottom: 100px; display: flex; }

    /* 左侧内容 */
    .content-left { flex: 1; padding: 30px; overflow-y: auto; }

    /* 进度卡片 */
    .day-progress { background: linear-gradient(135deg, #ead0a3, #d4c4a3); border-radius: 20px; padding: 25px; margin-bottom: 25px; border: 2px solid #6a3c22; }
    .progress-title { font-size: 26px; color: #3c271c; font-weight: bold; margin-bottom: 15px; display: flex; justify-content: space-between; }
    .progress-steps { display: flex; justify-content: space-around; }
    .step { display: flex; flex-direction: column; align-items: center; gap: 8px; }
    .step-circle { width: 60px; height: 60px; border-radius: 50%; background: #fff; border: 3px solid #6a3c22; display: flex; align-items: center; justify-content: center; font-size: 28px; }
    .step.done { background: #6a3c22; color: #ead0a3; }
    .step.current { border-color: #ead0a3; }
    .step-label { font-size: 16px; color: #6a3c22; }

    /* 武将列表 */
    .hero-list { display: flex; flex-direction: column; gap: 15px; }
    .hero-item { background: #fff; border-radius: 16px; padding: 20px; display: flex; align-items: center; gap: 20px; border: 1px solid #ead0a3; }
    .hero-thumb { width: 100px; height: 120px; background: linear-gradient(135deg, #ead0a3, #d4c4a3); border-radius: 12px; display: flex; align-items: center; justify-content: center; font-size: 60px; }
    .hero-info { flex: 1; }
    .hero-name { font-size: 28px; color: #3c271c; font-weight: bold; }
    .hero-tags { display: flex; gap: 10px; margin-top: 8px; }
    .tag { font-size: 16px; color: #6a3c22; background: #fff9f0; padding: 4px 12px; border-radius: 6px; }
    .hero-action { padding: 12px 24px; background: #6a3c22; color: #ead0a3; border-radius: 8px; font-size: 20px; cursor: pointer; border: none; }

    /* 右侧局部Tab */
    .right-tabs { width: 100px; background: #fff; border-left: 2px solid #ead0a3; display: flex; flex-direction: column; padding-top: 20px; }
    .right-tab { height: 100px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 8px; color: #6a3c22; cursor: pointer; border-left: 4px solid transparent; transition: all 0.2s; }
    .right-tab.active { background: #fff9f0; border-left-color: #ead0a3; color: #3c271c; }
    .right-tab-icon { font-size: 32px; }
    .right-tab-label { font-size: 18px; }

    /* 底部操作 */
    .bottom-bar { position: absolute; bottom: 0; left: 0; right: 0; height: 100px; background: #fff; border-top: 2px solid #ead0a3; display: flex; align-items: center; justify-content: center; }
    .action-btn { background: linear-gradient(180deg, #ead0a3, #d4c4a3); color: #3c271c; padding: 18px 60px; border-radius: 12px; font-size: 28px; font-weight: bold; cursor: pointer; border: 2px solid #6a3c22; }

    .layout-label { position: absolute; top: 10px; right: 10px; background: rgba(0,0,0,0.7); color: #fff; padding: 8px 16px; border-radius: 8px; font-size: 14px; z-index: 100; }
  </style>
</head>
<body>
  <div class="phone-frame">
    <div class="layout-label">布局4：左右布局 - 右侧局部Tab（局部内容切换）</div>

    <div class="header">
      <div class="header-title">预流失召回 · 武将体验</div>
    </div>

    <div class="main-area">
      <div class="content-left">
        <!-- 进度 -->
        <div class="day-progress">
          <div class="progress-title">
            <span>召回进度</span>
            <span>Day 1/3</span>
          </div>
          <div class="progress-steps">
            <div class="step done">✓</div>
            <div class="step done">✓</div>
            <div class="step current">3</div>
          </div>
        </div>

        <!-- 武将列表 -->
        <div class="hero-list">
          <div class="hero-item">
            <div class="hero-thumb">🎴</div>
            <div class="hero-info">
              <div class="hero-name">界钟会</div>
              <div class="hero-tags">
                <span class="tag">传说</span>
                <span class="tag">7天</span>
              </div>
            </div>
            <button class="hero-action">领取</button>
          </div>
          <div class="hero-item">
            <div class="hero-thumb">🎴</div>
            <div class="hero-info">
              <div class="hero-name">尹夫人</div>
              <div class="hero-tags">
                <span class="tag">史诗</span>
                <span class="tag">7天</span>
              </div>
            </div>
            <button class="hero-action">领取</button>
          </div>
        </div>
      </div>

      <!-- 右侧局部Tab -->
      <div class="right-tabs">
        <div class="right-tab active">
          <div class="right-tab-icon">🎴</div>
          <div class="right-tab-label">武将</div>
        </div>
        <div class="right-tab">
          <div class="right-tab-icon">📋</div>
          <div class="right-tab-label">任务</div>
        </div>
        <div class="right-tab">
          <div class="right-tab-icon">🎁</div>
          <div class="right-tab-label">奖励</div>
        </div>
      </div>
    </div>

    <div class="bottom-bar">
      <button class="action-btn">领取全部武将卡</button>
    </div>
  </div>
</body>
</html>
