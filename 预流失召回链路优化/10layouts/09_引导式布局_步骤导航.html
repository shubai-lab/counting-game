<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>布局9：引导式布局 - 步骤导航</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { font-family: -apple-system, BlinkMacSystemFont, sans-serif; background: #1a1a2e; min-height: 100vh; display: flex; justify-content: center; align-items: center; padding: 20px; }
    .phone-frame { width: 1334px; height: 750px; background: #fff9f0; border-radius: 40px; overflow: hidden; position: relative; box-shadow: 0 20px 60px rgba(0,0,0,0.3); }

    /* 顶部进度 */
    .top-progress { height: 100px; background: linear-gradient(180deg, #3c271c, #6a3c22); padding: 20px 40px; display: flex; flex-direction: column; justify-content: center; }
    .progress-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 15px; }
    .progress-title { font-size: 30px; color: #ead0a3; font-weight: bold; }
    .progress-day { font-size: 22px; color: #ead0a3; }
    .progress-track { height: 8px; background: rgba(255,255,255,0.2); border-radius: 4px; position: relative; }
    .progress-fill { position: absolute; left: 0; top: 0; bottom: 0; width: 33%; background: #ead0a3; border-radius: 4px; }

    /* 步骤导航 */
    .step-nav { display: flex; justify-content: center; gap: 0; margin: 30px 0; }
    .step-item { display: flex; flex-direction: column; align-items: center; position: relative; }
    .step-circle { width: 70px; height: 70px; border-radius: 50%; background: #fff; border: 4px solid #d4c4a3; display: flex; align-items: center; justify-content: center; font-size: 32px; color: #6a3c22; z-index: 1; }
    .step-item.active .step-circle { background: #ead0a3; border-color: #6a3c22; color: #3c271c; }
    .step-item.done .step-circle { background: #6a3c22; border-color: #6a3c22; color: #ead0a3; }
    .step-label { font-size: 20px; color: #6a3c22; margin-top: 10px; }
    .step-item.active .step-label { color: #3c271c; font-weight: bold; }
    .step-connector { width: 150px; height: 4px; background: #d4c4a3; margin-top: 35px; }
    .step-item.done + .step-connector { background: #6a3c22; }

    /* 主内容 */
    .main-content { position: absolute; top: 200px; left: 0; right: 0; bottom: 120px; padding: 0 50px; overflow-y: auto; }

    /* 武将卡片 */
    .hero-reveal { background: linear-gradient(135deg, #ead0a3, #d4c4a3); border-radius: 30px; padding: 40px; margin-bottom: 25px; display: flex; align-items: center; gap: 40px; border: 3px solid #6a3c22; box-shadow: 0 10px 30px rgba(106,60,34,0.2); }
    .hero-visual { width: 180px; height: 220px; background: #fff; border-radius: 20px; display: flex; align-items: center; justify-content: center; font-size: 120px; border: 3px solid #6a3c22; }
    .hero-details { flex: 1; }
    .hero-name { font-size: 48px; color: #3c271c; font-weight: bold; margin-bottom: 10px; }
    .hero-quality { font-size: 28px; color: #6a3c22; margin-bottom: 15px; }
    .hero-perks { display: flex; flex-wrap: wrap; gap: 10px; }
    .perk { background: #fff; padding: 10px 18px; border-radius: 10px; font-size: 18px; color: #6a3c22; border: 1px solid #d4c4a3; }
    .hero-duration { display: inline-block; background: #6a3c22; color: #ead0a3; padding: 12px 24px; border-radius: 12px; font-size: 22px; margin-top: 15px; }

    /* 任务提示 */
    .tips { background: #fff; border-radius: 20px; padding: 25px; border: 2px solid #ead0a3; }
    .tips-title { font-size: 26px; color: #3c271c; font-weight: bold; margin-bottom: 15px; display: flex; align-items: center; gap: 10px; }
    .tip-item { display: flex; align-items: center; gap: 15px; padding: 12px 0; border-bottom: 1px solid #ead0a3; }
    .tip-item:last-child { border-bottom: none; }
    .tip-icon { font-size: 28px; }
    .tip-text { font-size: 22px; color: #6a3c22; }

    /* 底部操作 */
    .bottom-bar { position: absolute; bottom: 0; left: 0; right: 0; height: 120px; background: #fff; border-top: 2px solid #ead0a3; display: flex; align-items: center; justify-content: center; gap: 30px; padding: 0 50px; }
    .btn-nav { padding: 18px 40px; border-radius: 14px; font-size: 26px; font-weight: bold; cursor: pointer; border: 3px solid; }
    .btn-back { background: transparent; color: #6a3c22; border-color: #6a3c22; }
    .btn-claim { background: linear-gradient(180deg, #ead0a3, #d4c4a3); color: #3c271c; border-color: #6a3c22; }

    .layout-label { position: absolute; top: 10px; right: 10px; background: rgba(0,0,0,0.7); color: #fff; padding: 8px 16px; border-radius: 8px; font-size: 14px; z-index: 100; }
  </style>
</head>
<body>
  <div class="phone-frame">
    <div class="layout-label">布局9：引导式布局 - 步骤导航（线性层级引导）</div>

    <!-- 顶部进度 -->
    <div class="top-progress">
      <div class="progress-header">
        <div class="progress-title">武将体验卡 · 召回活动</div>
        <div class="progress-day">1/3 天</div>
      </div>
      <div class="progress-track">
        <div class="progress-fill"></div>
      </div>
    </div>

    <!-- 步骤导航 -->
    <div class="step-nav">
      <div class="step-item done">
        <div class="step-circle">1</div>
        <div class="step-label">登录</div>
      </div>
      <div class="step-connector"></div>
      <div class="step-item active">
        <div class="step-circle">2</div>
        <div class="step-label">领卡</div>
      </div>
      <div class="step-connector"></div>
      <div class="step-item">
        <div class="step-circle">3</div>
        <div class="step-label">对局</div>
      </div>
    </div>

    <!-- 主内容 -->
    <div class="main-content">
      <!-- 武将卡片 -->
      <div class="hero-reveal">
        <div class="hero-visual">🎴</div>
        <div class="hero-details">
          <div class="hero-name">界钟会</div>
          <div class="hero-quality">传说品质武将</div>
          <div class="hero-perks">
            <span class="perk">限定皮肤</span>
            <span class="perk">全武将技能</span>
            <span class="perk">经验加成</span>
          </div>
          <div class="hero-duration">有效期：7天</div>
        </div>
      </div>

      <!-- 任务提示 -->
      <div class="tips">
        <div class="tips-title">📋 领取说明</div>
        <div class="tip-item">
          <div class="tip-icon">✓</div>
          <div class="tip-text">今日任务已完成，可领取武将体验卡</div>
        </div>
        <div class="tip-item">
          <div class="tip-icon">💡</div>
          <div class="tip-text">武将卡将在首局PVE对局中100%出现</div>
        </div>
        <div class="tip-item">
          <div class="tip-icon">📅</div>
          <div class="tip-text">明日登录可领取下一张武将卡</div>
        </div>
      </div>
    </div>

    <!-- 底部操作 -->
    <div class="bottom-bar">
      <button class="btn-nav btn-back">上一步</button>
      <button class="btn-nav btn-claim">立即领取</button>
    </div>
  </div>
</body>
</html>
