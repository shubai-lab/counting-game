<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>布局6：列表式布局 - 横向滑动</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { font-family: -apple-system, BlinkMacSystemFont, sans-serif; background: #1a1a2e; min-height: 100vh; display: flex; justify-content: center; align-items: center; padding: 20px; }
    .phone-frame { width: 1334px; height: 750px; background: #fff9f0; border-radius: 40px; overflow: hidden; position: relative; box-shadow: 0 20px 60px rgba(0,0,0,0.3); }

    /* 标题区 */
    .header { height: 90px; background: #3c271c; display: flex; align-items: center; justify-content: center; }
    .header-title { font-size: 34px; color: #ead0a3; font-weight: bold; }

    /* 主内容 */
    .main-content { position: absolute; top: 90px; left: 0; right: 0; bottom: 0; }

    /* 横向滑动区 */
    .days-scroll { display: flex; overflow-x: auto; scroll-snap-type: x mandatory; -webkit-overflow-scrolling: touch; padding: 25px; gap: 20px; }
    .days-scroll::-webkit-scrollbar { display: none; }

    .day-card { min-width: 380px; height: 200px; background: linear-gradient(135deg, #ead0a3, #d4c4a3); border-radius: 24px; padding: 25px; scroll-snap-align: start; border: 2px solid #6a3c22; display: flex; flex-direction: column; justify-content: space-between; }
    .day-card.current { border-color: #ead0a3; box-shadow: 0 8px 30px rgba(234, 208, 163, 0.5); }
    .day-card.locked { opacity: 0.5; filter: grayscale(50%); }

    .day-header { display: flex; justify-content: space-between; align-items: center; }
    .day-title { font-size: 30px; color: #3c271c; font-weight: bold; }
    .day-badge { background: #6a3c22; color: #ead0a3; padding: 6px 16px; border-radius: 15px; font-size: 16px; }
    .day-card.current .day-badge { background: #3c271c; }

    .day-hero { display: flex; align-items: center; gap: 20px; }
    .hero-avatar { font-size: 80px; }
    .hero-detail { flex: 1; }
    .hero-name { font-size: 32px; color: #3c271c; font-weight: bold; }
    .hero-desc { font-size: 18px; color: #6a3c22; }
    .hero-btn { padding: 12px 24px; background: #6a3c22; color: #ead0a3; border-radius: 8px; font-size: 20px; border: none; cursor: pointer; }
    .day-card.current .hero-btn { background: #3c271c; }

    /* 任务列表 */
    .task-list { padding: 0 25px; }
    .section-title { font-size: 26px; color: #3c271c; font-weight: bold; margin-bottom: 15px; padding-left: 5px; }
    .task-item { background: #fff; border-radius: 16px; padding: 20px 25px; margin-bottom: 12px; display: flex; align-items: center; justify-content: space-between; border: 1px solid #ead0a3; }
    .task-left { display: flex; align-items: center; gap: 18px; }
    .task-icon { width: 50px; height: 50px; background: #fff9f0; border-radius: 12px; display: flex; align-items: center; justify-content: center; font-size: 28px; }
    .task-info {}
    .task-name { font-size: 24px; color: #3c271c; font-weight: bold; }
    .task-status { font-size: 16px; color: #6a3c22; margin-top: 4px; }
    .task-action { padding: 10px 20px; background: #6a3c22; color: #ead0a3; border-radius: 8px; font-size: 18px; border: none; cursor: pointer; }
    .task-action.done { background: #6a3c22; opacity: 0.6; }

    /* 指示器 */
    .scroll-indicator { display: flex; justify-content: center; gap: 10px; padding: 15px; }
    .indicator-dot { width: 12px; height: 12px; border-radius: 50%; background: #d4c4a3; }
    .indicator-dot.active { background: #6a3c22; width: 30px; border-radius: 6px; }

    .layout-label { position: absolute; top: 10px; right: 10px; background: rgba(0,0,0,0.7); color: #fff; padding: 8px 16px; border-radius: 8px; font-size: 14px; z-index: 100; }
  </style>
</head>
<body>
  <div class="phone-frame">
    <div class="layout-label">布局6：列表式布局 - 横向滑动卡片（每日可滑动切换）</div>

    <div class="header">
      <div class="header-title">预流失召回 · 武将体验</div>
    </div>

    <div class="main-content">
      <!-- 横向滑动区 -->
      <div class="days-scroll">
        <div class="day-card">
          <div class="day-header">
            <div class="day-title">Day 1</div>
            <div class="day-badge">已完成</div>
          </div>
          <div class="day-hero">
            <div class="hero-avatar">🎴</div>
            <div class="hero-detail">
              <div class="hero-name">界钟会</div>
              <div class="hero-desc">传说武将</div>
            </div>
            <button class="hero-btn">已领取</button>
          </div>
        </div>

        <div class="day-card current">
          <div class="day-header">
            <div class="day-title">Day 2</div>
            <div class="day-badge">今日</div>
          </div>
          <div class="day-hero">
            <div class="hero-avatar">🎴</div>
            <div class="hero-detail">
              <div class="hero-name">尹夫人</div>
              <div class="hero-desc">史诗武将</div>
            </div>
            <button class="hero-btn">领取</button>
          </div>
        </div>

        <div class="day-card locked">
          <div class="day-header">
            <div class="day-title">Day 3</div>
            <div class="day-badge">明日</div>
          </div>
          <div class="day-hero">
            <div class="hero-avatar">🎴</div>
            <div class="hero-detail">
              <div class="hero-name">牛辅</div>
              <div class="hero-desc">稀有武将</div>
            </div>
            <button class="hero-btn">锁定</button>
          </div>
        </div>
      </div>

      <!-- 指示器 -->
      <div class="scroll-indicator">
        <div class="indicator-dot"></div>
        <div class="indicator-dot active"></div>
        <div class="indicator-dot"></div>
      </div>

      <!-- 任务列表 -->
      <div class="task-list">
        <div class="section-title">今日任务</div>
        <div class="task-item">
          <div class="task-left">
            <div class="task-icon">📱</div>
            <div class="task-info">
              <div class="task-name">登录游戏</div>
              <div class="task-status">已完成</div>
            </div>
          </div>
          <button class="task-action done">✓</button>
        </div>
        <div class="task-item">
          <div class="task-left">
            <div class="task-icon">🎮</div>
            <div class="task-info">
              <div class="task-name">完成任意对局1次</div>
              <div class="task-status">0/1</div>
            </div>
          </div>
          <button class="task-action">去完成</button>
        </div>
      </div>
    </div>
  </div>
</body>
</html>
