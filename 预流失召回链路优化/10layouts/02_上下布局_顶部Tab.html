<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>布局2：上下布局 - 顶部Tab</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { font-family: -apple-system, BlinkMacSystemFont, sans-serif; background: #1a1a2e; min-height: 100vh; display: flex; justify-content: center; align-items: center; padding: 20px; }
    .phone-frame { width: 1334px; height: 750px; background: #fff9f0; border-radius: 40px; overflow: hidden; position: relative; box-shadow: 0 20px 60px rgba(0,0,0,0.3); }

    /* 顶部区域 */
    .top-bar { height: 80px; background: linear-gradient(180deg, #6a3c22, #3c271c); display: flex; align-items: center; justify-content: center; position: relative; }
    .top-title { font-size: 32px; color: #ead0a3; font-weight: bold; }

    /* 顶部Tab */
    .top-tabs { display: flex; background: #fff; border-bottom: 2px solid #ead0a3; }
    .top-tab { flex: 1; height: 70px; display: flex; align-items: center; justify-content: center; font-size: 26px; color: #6a3c22; cursor: pointer; border-bottom: 3px solid transparent; transition: all 0.2s; }
    .top-tab.active { color: #3c271c; border-bottom-color: #ead0a3; background: #fff9f0; }
    .top-tab:hover { background: #fff9f0; }

    /* 内容区 */
    .content { position: absolute; top: 150px; left: 0; right: 0; bottom: 120px; overflow-y: auto; padding: 30px; }

    /* 进度卡片 */
    .progress-card { background: linear-gradient(135deg, #ead0a3, #d4c4a3); border-radius: 20px; padding: 30px; margin-bottom: 25px; border: 2px solid #6a3c22; }
    .progress-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; }
    .progress-title { font-size: 28px; color: #3c271c; font-weight: bold; }
    .progress-day { font-size: 22px; color: #6a3c22; }
    .progress-dots { display: flex; justify-content: center; gap: 40px; }
    .dot-item { display: flex; flex-direction: column; align-items: center; gap: 10px; }
    .dot { width: 50px; height: 50px; border-radius: 50%; background: #fff; border: 3px solid #6a3c22; display: flex; align-items: center; justify-content: center; font-size: 24px; }
    .dot.completed { background: #6a3c22; color: #ead0a3; }
    .dot.current { border-color: #ead0a3; animation: pulse 1.5s infinite; }
    @keyframes pulse { 0%, 100% { box-shadow: 0 0 0 0 rgba(234, 208, 163, 0.7); } 50% { box-shadow: 0 0 0 10px rgba(234, 208, 163, 0); } }
    .dot-label { font-size: 18px; color: #6a3c22; }

    /* 武将卡 */
    .hero-section { margin-bottom: 25px; }
    .section-title { font-size: 26px; color: #3c271c; margin-bottom: 15px; display: flex; align-items: center; gap: 10px; }
    .hero-card { background: #fff; border-radius: 16px; padding: 25px; display: flex; align-items: center; gap: 25px; border: 1px solid #ead0a3; }
    .hero-icon { width: 120px; height: 150px; background: linear-gradient(135deg, #ead0a3, #d4c4a3); border-radius: 12px; display: flex; align-items: center; justify-content: center; font-size: 80px; }
    .hero-info { flex: 1; }
    .hero-name { font-size: 32px; color: #3c271c; font-weight: bold; margin-bottom: 8px; }
    .hero-desc { font-size: 20px; color: #6a3c22; margin-bottom: 15px; }
    .hero-status { display: inline-block; background: #6a3c22; color: #ead0a3; padding: 8px 20px; border-radius: 8px; font-size: 20px; }

    /* 底部操作区 */
    .bottom-bar { position: absolute; bottom: 0; left: 0; right: 0; height: 120px; background: #fff; border-top: 2px solid #ead0a3; display: flex; align-items: center; justify-content: center; gap: 30px; padding: 0 40px; }
    .action-btn { background: linear-gradient(180deg, #ead0a3, #d4c4a3); color: #3c271c; padding: 18px 50px; border-radius: 12px; font-size: 28px; font-weight: bold; cursor: pointer; border: 2px solid #6a3c22; }

    .layout-label { position: absolute; top: 10px; right: 10px; background: rgba(0,0,0,0.7); color: #fff; padding: 8px 16px; border-radius: 8px; font-size: 14px; z-index: 100; }
  </style>
</head>
<body>
  <div class="phone-frame">
    <div class="layout-label">布局2：上下布局 - 顶部Tab（固定高度，宽度适配）</div>

    <!-- 顶部 -->
    <div class="top-bar">
      <div class="top-title">预流失召回 · 武将体验</div>
    </div>

    <!-- 顶部Tab -->
    <div class="top-tabs">
      <div class="top-tab active">任务</div>
      <div class="top-tab">武将</div>
      <div class="top-tab">奖励</div>
    </div>

    <!-- 内容区 -->
    <div class="content">
      <!-- 进度 -->
      <div class="progress-card">
        <div class="progress-header">
          <div class="progress-title">召回进度</div>
          <div class="progress-day">Day 1 / 3</div>
        </div>
        <div class="progress-dots">
          <div class="dot-item">
            <div class="dot current">1</div>
            <div class="dot-label">今日</div>
          </div>
          <div class="dot-item">
            <div class="dot">2</div>
            <div class="dot-label">明日</div>
          </div>
          <div class="dot-item">
            <div class="dot">3</div>
            <div class="dot-label">第三日</div>
          </div>
        </div>
      </div>

      <!-- 武将卡 -->
      <div class="hero-section">
        <div class="section-title">🎴 今日武将体验卡</div>
        <div class="hero-card">
          <div class="hero-icon">🎴</div>
          <div class="hero-info">
            <div class="hero-name">界钟会</div>
            <div class="hero-desc">传说武将 · 7天有效期</div>
            <div class="hero-status">可领取</div>
          </div>
        </div>
      </div>
    </div>

    <!-- 底部操作 -->
    <div class="bottom-bar">
      <button class="action-btn">立即领取武将卡</button>
    </div>
  </div>
</body>
</html>
