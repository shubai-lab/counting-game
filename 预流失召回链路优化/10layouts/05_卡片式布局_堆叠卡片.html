<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>布局5：卡片式布局 - 堆叠卡片</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { font-family: -apple-system, BlinkMacSystemFont, sans-serif; background: #1a1a2e; min-height: 100vh; display: flex; justify-content: center; align-items: center; padding: 20px; }
    .phone-frame { width: 1334px; height: 750px; background: #fff9f0; border-radius: 40px; overflow: hidden; position: relative; box-shadow: 0 20px 60px rgba(0,0,0,0.3); }

    /* 顶部 */
    .top-bar { height: 100px; background: linear-gradient(180deg, #3c271c, #6a3c22); padding: 15px 30px; display: flex; flex-direction: column; justify-content: center; }
    .top-title { font-size: 36px; color: #ead0a3; font-weight: bold; }
    .top-sub { font-size: 20px; color: #ead0a3; opacity: 0.7; margin-top: 5px; }

    /* 卡片容器 */
    .card-container { position: absolute; top: 100px; left: 0; right: 0; bottom: 0; padding: 20px; overflow-y: auto; }

    /* 堆叠卡片 */
    .stack-card { background: #fff; border-radius: 24px; margin-bottom: 20px; overflow: hidden; box-shadow: 0 4px 20px rgba(0,0,0,0.1); }
    .card-header { background: linear-gradient(135deg, #ead0a3, #d4c4a3); padding: 20px 25px; display: flex; justify-content: space-between; align-items: center; border-bottom: 2px solid #6a3c22; }
    .card-day { font-size: 28px; color: #3c271c; font-weight: bold; }
    .card-status { background: #6a3c22; color: #ead0a3; padding: 8px 20px; border-radius: 20px; font-size: 18px; }
    .card-body { padding: 20px 25px; }
    .card-row { display: flex; align-items: center; gap: 20px; margin-bottom: 15px; }
    .card-icon { width: 80px; height: 100px; background: linear-gradient(135deg, #ead0a3, #d4c4a3); border-radius: 12px; display: flex; align-items: center; justify-content: center; font-size: 50px; }
    .card-info { flex: 1; }
    .card-name { font-size: 28px; color: #3c271c; font-weight: bold; margin-bottom: 5px; }
    .card-desc { font-size: 18px; color: #6a3c22; }
    .card-action { padding: 15px 30px; background: #6a3c22; color: #ead0a3; border-radius: 10px; font-size: 22px; cursor: pointer; border: none; font-weight: bold; }

    /* 任务行 */
    .task-row { display: flex; align-items: center; justify-content: space-between; padding: 15px 0; border-top: 1px solid #ead0a3; }
    .task-left { display: flex; align-items: center; gap: 15px; }
    .task-icon { font-size: 28px; }
    .task-name { font-size: 22px; color: #3c271c; }
    .task-check { width: 40px; height: 40px; border-radius: 50%; background: #6a3c22; color: #ead0a3; display: flex; align-items: center; justify-content: center; font-size: 24px; }

    /* 底部导航 */
    .bottom-nav { position: absolute; bottom: 0; left: 0; right: 0; height: 100px; background: #fff; display: flex; border-top: 2px solid #ead0a3; }
    .nav-item { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 8px; color: #6a3c22; cursor: pointer; }
    .nav-item.active { color: #3c271c; background: #fff9f0; }
    .nav-icon { font-size: 36px; }
    .nav-label { font-size: 18px; }

    .layout-label { position: absolute; top: 10px; right: 10px; background: rgba(0,0,0,0.7); color: #fff; padding: 8px 16px; border-radius: 8px; font-size: 14px; z-index: 100; }
  </style>
</head>
<body>
  <div class="phone-frame">
    <div class="layout-label">布局5：卡片式布局 - 堆叠卡片（每日卡片展开）</div>

    <div class="top-bar">
      <div class="top-title">武将体验卡 · 召回活动</div>
      <div class="top-sub">连续3日领取武将体验卡</div>
    </div>

    <div class="card-container">
      <!-- Day 1 卡片 -->
      <div class="stack-card">
        <div class="card-header">
          <div class="card-day">Day 1 · 今日</div>
          <div class="card-status">可领取</div>
        </div>
        <div class="card-body">
          <div class="card-row">
            <div class="card-icon">🎴</div>
            <div class="card-info">
              <div class="card-name">界钟会</div>
              <div class="card-desc">传说武将 · 有效期7天</div>
            </div>
            <button class="card-action">立即领取</button>
          </div>
          <div class="task-row">
            <div class="task-left">
              <div class="task-icon">✓</div>
              <div class="task-name">登录游戏</div>
            </div>
            <div class="task-check">✓</div>
          </div>
          <div class="task-row">
            <div class="task-left">
              <div class="task-icon">🎮</div>
              <div class="task-name">完成任意对局1次</div>
            </div>
            <div class="task-check">→</div>
          </div>
        </div>
      </div>

      <!-- Day 2 卡片 -->
      <div class="stack-card" style="opacity: 0.6;">
        <div class="card-header">
          <div class="card-day">Day 2 · 明日</div>
          <div class="card-status">未开始</div>
        </div>
        <div class="card-body">
          <div class="card-row">
            <div class="card-icon" style="filter: grayscale(100%);">🎴</div>
            <div class="card-info">
              <div class="card-name">尹夫人</div>
              <div class="card-desc">史诗武将 · 有效期7天</div>
            </div>
            <button class="card-action" style="opacity: 0.5;">明日解锁</button>
          </div>
        </div>
      </div>

      <!-- Day 3 卡片 -->
      <div class="stack-card" style="opacity: 0.6;">
        <div class="card-header">
          <div class="card-day">Day 3 · 后日</div>
          <div class="card-status">未开始</div>
        </div>
        <div class="card-body">
          <div class="card-row">
            <div class="card-icon" style="filter: grayscale(100%);">🎴</div>
            <div class="card-info">
              <div class="card-name">牛辅</div>
              <div class="card-desc">稀有武将 · 有效期7天</div>
            </div>
            <button class="card-action" style="opacity: 0.5;">后日解锁</button>
          </div>
        </div>
      </div>
    </div>

    <div class="bottom-nav">
      <div class="nav-item active">
        <div class="nav-icon">🏠</div>
        <div class="nav-label">活动</div>
      </div>
      <div class="nav-item">
        <div class="nav-icon">🎴</div>
        <div class="nav-label">武将</div>
      </div>
      <div class="nav-item">
        <div class="nav-icon">📋</div>
        <div class="nav-label">任务</div>
      </div>
      <div class="nav-item">
        <div class="nav-icon">📜</div>
        <div class="nav-label">规则</div>
      </div>
    </div>
  </div>
</body>
</html>
