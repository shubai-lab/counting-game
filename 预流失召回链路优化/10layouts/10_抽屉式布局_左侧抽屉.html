<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>布局10：抽屉式布局 - 左侧抽屉</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { font-family: -apple-system, BlinkMacSystemFont, sans-serif; background: #1a1a2e; min-height: 100vh; display: flex; justify-content: center; align-items: center; padding: 20px; }
    .phone-frame { width: 1334px; height: 750px; background: #fff9f0; border-radius: 40px; overflow: hidden; position: relative; box-shadow: 0 20px 60px rgba(0,0,0,0.3); }

    /* 背景界面 */
    .bg-page { position: absolute; inset: 0; }
    .bg-header { height: 80px; background: linear-gradient(180deg, #6a3c22, #3c271c); display: flex; align-items: center; padding: 0 25px; gap: 20px; }
    .menu-btn { width: 50px; height: 50px; background: rgba(255,255,255,0.1); border-radius: 10px; display: flex; align-items: center; justify-content: center; color: #ead0a3; font-size: 28px; cursor: pointer; }
    .bg-title { font-size: 30px; color: #ead0a3; font-weight: bold; }
    .bg-content { padding: 30px; }
    .placeholder { height: 300px; background: #fff; border-radius: 20px; display: flex; align-items: center; justify-content: center; color: #6a3c22; font-size: 24px; opacity: 0.5; border: 2px dashed #ead0a3; }

    /* 左侧抽屉 */
    .drawer { position: absolute; left: 0; top: 0; bottom: 0; width: 500px; background: #fff; box-shadow: 10px 0 40px rgba(0,0,0,0.3); transform: translateX(-100%); transition: transform 0.3s ease-out; z-index: 50; }
    .drawer.open { transform: translateX(0); }

    .drawer-header { height: 80px; background: linear-gradient(135deg, #ead0a3, #d4c4a3); display: flex; align-items: center; justify-content: space-between; padding: 0 25px; border-bottom: 3px solid #6a3c22; }
    .drawer-title { font-size: 32px; color: #3c271c; font-weight: bold; }
    .drawer-close { width: 50px; height: 50px; background: #6a3c22; color: #ead0a3; border-radius: 10px; display: flex; align-items: center; justify-content: center; font-size: 28px; cursor: pointer; border: none; }

    .drawer-body { flex: 1; overflow-y: auto; padding: 25px; }

    /* 抽屉内内容 */
    .drawer-section { margin-bottom: 25px; }
    .section-head { font-size: 26px; color: #3c271c; font-weight: bold; margin-bottom: 15px; display: flex; align-items: center; gap: 10px; }
    .hero-card { background: linear-gradient(135deg, #ead0a3, #d4c4a3); border-radius: 16px; padding: 20px; display: flex; align-items: center; gap: 20px; margin-bottom: 12px; border: 2px solid #6a3c22; }
    .hero-icon-sm { width: 80px; height: 100px; background: #fff; border-radius: 10px; display: flex; align-items: center; justify-content: center; font-size: 50px; }
    .hero-info-sm { flex: 1; }
    .hero-name-sm { font-size: 26px; color: #3c271c; font-weight: bold; }
    .hero-desc-sm { font-size: 16px; color: #6a3c22; margin-top: 4px; }
    .hero-status-badge { background: #6a3c22; color: #ead0a3; padding: 8px 16px; border-radius: 8px; font-size: 16px; }
    .hero-status-badge.done { background: #ead0a3; color: #6a3c22; }

    .task-item-drawer { background: #fff; border-radius: 12px; padding: 18px 20px; margin-bottom: 10px; display: flex; align-items: center; justify-content: space-between; border: 1px solid #ead0a3; }
    .task-left-d { display: flex; align-items: center; gap: 15px; }
    .task-icon-d { font-size: 26px; }
    .task-name-d { font-size: 22px; color: #3c271c; }
    .task-check-d { width: 35px; height: 35px; background: #6a3c22; color: #ead0a3; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 20px; }

    /* 抽屉底部 */
    .drawer-footer { padding: 20px 25px; background: #fff; border-top: 2px solid #ead0a3; }
    .drawer-btn { width: 100%; padding: 18px; background: linear-gradient(180deg, #ead0a3, #d4c4a3); color: #3c271c; border-radius: 14px; font-size: 28px; font-weight: bold; cursor: pointer; border: 2px solid #6a3c22; }

    /* 遮罩 */
    .drawer-overlay { position: absolute; inset: 0; background: rgba(0,0,0,0.5); opacity: 0; pointer-events: none; transition: opacity 0.3s; z-index: 40; }
    .drawer-overlay.show { opacity: 1; pointer-events: auto; }

    .layout-label { position: absolute; top: 10px; right: 10px; background: rgba(0,0,0,0.7); color: #fff; padding: 8px 16px; border-radius: 8px; font-size: 14px; z-index: 100; }
  </style>
</head>
<body>
  <div class="phone-frame">
    <div class="layout-label">布局10：抽屉式布局 - 左侧抽屉（侧滑弹出，功能聚合）</div>

    <!-- 背景页面 -->
    <div class="bg-page">
      <div class="bg-header">
        <div class="menu-btn">☰</div>
        <div class="bg-title">预流失召回</div>
      </div>
      <div class="bg-content">
        <div class="placeholder">主界面内容区域<br><br>点击左上角菜单打开侧边抽屉</div>
      </div>
    </div>

    <!-- 遮罩 -->
    <div class="drawer-overlay"></div>

    <!-- 左侧抽屉 -->
    <div class="drawer">
      <div class="drawer-header">
        <div class="drawer-title">武将体验</div>
        <button class="drawer-close">×</button>
      </div>

      <div class="drawer-body">
        <!-- 武将列表 -->
        <div class="drawer-section">
          <div class="section-head">🎴 我的武将卡</div>
          <div class="hero-card">
            <div class="hero-icon-sm">🎴</div>
            <div class="hero-info-sm">
              <div class="hero-name-sm">界钟会</div>
              <div class="hero-desc-sm">传说 · 7天</div>
            </div>
            <div class="hero-status-badge done">已领取</div>
          </div>
          <div class="hero-card">
            <div class="hero-icon-sm">🎴</div>
            <div class="hero-info-sm">
              <div class="hero-name-sm">尹夫人</div>
              <div class="hero-desc-sm">史诗 · 7天</div>
            </div>
            <div class="hero-status-badge">Day2</div>
          </div>
          <div class="hero-card" style="opacity: 0.5;">
            <div class="hero-icon-sm" style="filter: grayscale(100%);">🎴</div>
            <div class="hero-info-sm">
              <div class="hero-name-sm">牛辅</div>
              <div class="hero-desc-sm">稀有 · 7天</div>
            </div>
            <div class="hero-status-badge">Day3</div>
          </div>
        </div>

        <!-- 任务列表 -->
        <div class="drawer-section">
          <div class="section-head">📋 今日任务</div>
          <div class="task-item-drawer">
            <div class="task-left-d">
              <div class="task-icon-d">✓</div>
              <div class="task-name-d">登录游戏</div>
            </div>
            <div class="task-check-d">✓</div>
          </div>
          <div class="task-item-drawer">
            <div class="task-left-d">
              <div class="task-icon-d">🎮</div>
              <div class="task-name-d">完成任意对局1次</div>
            </div>
            <div class="task-check-d">→</div>
          </div>
        </div>
      </div>

      <div class="drawer-footer">
        <button class="drawer-btn">领取武将卡</button>
      </div>
    </div>
  </div>
</body>
</html>
