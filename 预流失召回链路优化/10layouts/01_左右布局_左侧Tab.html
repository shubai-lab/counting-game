<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>布局1：左右布局 - 左侧Tab</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { font-family: -apple-system, BlinkMacSystemFont, sans-serif; background: #1a1a2e; min-height: 100vh; display: flex; justify-content: center; align-items: center; padding: 20px; }
    .phone-frame { width: 1334px; height: 750px; background: #fff9f0; border-radius: 40px; overflow: hidden; position: relative; box-shadow: 0 20px 60px rgba(0,0,0,0.3); }

    /* 左侧Tab栏 */
    .left-tab { position: absolute; left: 0; top: 0; bottom: 0; width: 120px; background: linear-gradient(180deg, #3c271c, #6a3c22); display: flex; flex-direction: column; padding-top: 60px; }
    .tab-item { height: 100px; display: flex; align-items: center; justify-content: center; color: #ead0a3; font-size: 24px; cursor: pointer; border-left: 4px solid transparent; transition: all 0.2s; }
    .tab-item.active { background: rgba(255,255,255,0.1); border-left-color: #ead0a3; color: #fff; }
    .tab-item:hover { background: rgba(255,255,255,0.1); }

    /* 右侧内容区 */
    .main-content { position: absolute; left: 120px; right: 0; top: 0; bottom: 0; background: #fff9f0; }
    .header { height: 80px; background: #ead0a3; display: flex; align-items: center; justify-content: center; }
    .header-title { font-size: 32px; color: #3c271c; font-weight: bold; }

    /* 武将卡展示区 */
    .card-section { padding: 30px; }
    .section-title { font-size: 28px; color: #3c271c; margin-bottom: 20px; }
    .card-list { display: flex; gap: 20px; flex-wrap: wrap; }
    .card-item { width: 200px; height: 280px; background: linear-gradient(135deg, #ead0a3, #d4c4a3); border-radius: 16px; display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 20px; border: 2px solid #6a3c22; }
    .card-icon { font-size: 64px; margin-bottom: 15px; }
    .card-name { font-size: 28px; color: #3c271c; font-weight: bold; margin-bottom: 8px; }
    .card-desc { font-size: 18px; color: #6a3c22; text-align: center; }

    /* 任务区域 */
    .task-section { padding: 30px; }
    .task-item { background: #fff; border-radius: 12px; padding: 20px; margin-bottom: 15px; display: flex; align-items: center; justify-content: space-between; border: 1px solid #ead0a3; }
    .task-info { display: flex; align-items: center; gap: 15px; }
    .task-icon { font-size: 32px; }
    .task-name { font-size: 24px; color: #3c271c; }
    .task-btn { background: #6a3c22; color: #ead0a3; padding: 12px 24px; border-radius: 8px; font-size: 22px; cursor: pointer; border: none; }
    .task-btn:hover { background: #3c271c; }

    /* 底部操作区 */
    .bottom-bar { position: absolute; bottom: 0; left: 120px; right: 0; height: 100px; background: #fff; border-top: 2px solid #ead0a3; display: flex; align-items: center; justify-content: center; gap: 30px; padding: 0 40px; }
    .action-btn { background: linear-gradient(180deg, #ead0a3, #d4c4a3); color: #3c271c; padding: 16px 40px; border-radius: 12px; font-size: 26px; font-weight: bold; cursor: pointer; border: 2px solid #6a3c22; }

    .layout-label { position: absolute; top: 10px; right: 10px; background: rgba(0,0,0,0.7); color: #fff; padding: 8px 16px; border-radius: 8px; font-size: 14px; z-index: 100; }
  </style>
</head>
<body>
  <div class="phone-frame">
    <div class="layout-label">布局1：左右布局 - 左侧Tab（固定宽度，高度适配）</div>

    <!-- 左侧Tab栏 -->
    <div class="left-tab">
      <div class="tab-item active">任务</div>
      <div class="tab-item">奖励</div>
      <div class="tab-item">规则</div>
    </div>

    <!-- 右侧内容区 -->
    <div class="main-content">
      <div class="header">
        <div class="header-title">预流失召回 · 武将体验</div>
      </div>

      <!-- 武将卡展示 -->
      <div class="card-section">
        <div class="section-title">今日可领取武将</div>
        <div class="card-list">
          <div class="card-item">
            <div class="card-icon">🎴</div>
            <div class="card-name">界钟会</div>
            <div class="card-desc">传说品质<br>7天有效期</div>
          </div>
          <div class="card-item">
            <div class="card-icon">🎴</div>
            <div class="card-name">尹夫人</div>
            <div class="card-desc">史诗品质<br>7天有效期</div>
          </div>
          <div class="card-item">
            <div class="card-icon">🎴</div>
            <div class="card-name">牛辅</div>
            <div class="card-desc">稀有品质<br>7天有效期</div>
          </div>
        </div>
      </div>

      <!-- 任务区域 -->
      <div class="task-section">
        <div class="task-item">
          <div class="task-info">
            <div class="task-icon">📱</div>
            <div class="task-name">登录游戏</div>
          </div>
          <button class="task-btn">已完成</button>
        </div>
        <div class="task-item">
          <div class="task-info">
            <div class="task-icon">🎮</div>
            <div class="task-name">完成任意对局1次</div>
          </div>
          <button class="task-btn">去完成</button>
        </div>
      </div>

      <!-- 底部操作区 -->
      <div class="bottom-bar">
        <button class="action-btn">领取武将卡</button>
      </div>
    </div>
  </div>
</body>
</html>
