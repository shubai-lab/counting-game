<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>布局3：全屏布局 - 无Tab</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { font-family: -apple-system, BlinkMacSystemFont, sans-serif; background: #1a1a2e; min-height: 100vh; display: flex; justify-content: center; align-items: center; padding: 20px; }
    .phone-frame { width: 1334px; height: 750px; background: linear-gradient(180deg, #3c271c, #6a3c22); border-radius: 40px; overflow: hidden; position: relative; box-shadow: 0 20px 60px rgba(0,0,0,0.3); }

    /* 全屏沉浸式 */
    .fullscreen { position: absolute; inset: 0; display: flex; flex-direction: column; padding: 40px; }

    /* 标题区 */
    .header { text-align: center; margin-bottom: 30px; }
    .main-title { font-size: 48px; color: #ead0a3; font-weight: bold; margin-bottom: 10px; }
    .sub-title { font-size: 24px; color: #ead0a3; opacity: 0.8; }

    /* 进度指示 */
    .progress-bar { display: flex; justify-content: center; gap: 30px; margin-bottom: 40px; }
    .day-badge { width: 80px; height: 80px; border-radius: 50%; background: rgba(255,255,255,0.1); border: 3px solid #ead0a3; display: flex; flex-direction: column; align-items: center; justify-content: center; color: #ead0a3; }
    .day-badge.active { background: #ead0a3; color: #3c271c; }
    .day-badge span:first-child { font-size: 28px; font-weight: bold; }
    .day-badge span:last-child { font-size: 14px; }

    /* 武将展示 */
    .hero-showcase { flex: 1; display: flex; justify-content: center; align-items: center; }
    .hero-card-large { width: 400px; background: linear-gradient(135deg, rgba(234,208,163,0.9), rgba(212,196,163,0.9)); border-radius: 30px; padding: 40px; text-align: center; border: 4px solid #ead0a3; box-shadow: 0 20px 60px rgba(0,0,0,0.3); }
    .hero-avatar { font-size: 150px; margin-bottom: 20px; }
    .hero-name-large { font-size: 48px; color: #3c271c; font-weight: bold; margin-bottom: 10px; }
    .hero-quality { font-size: 28px; color: #6a3c22; margin-bottom: 15px; }
    .hero-duration { font-size: 22px; color: #6a3c22; background: rgba(255,255,255,0.5); padding: 10px 25px; border-radius: 20px; display: inline-block; }

    /* 底部操作 */
    .bottom-actions { display: flex; justify-content: center; gap: 30px; }
    .btn-large { padding: 22px 60px; border-radius: 16px; font-size: 32px; font-weight: bold; cursor: pointer; border: 3px solid; transition: all 0.2s; }
    .btn-primary { background: linear-gradient(180deg, #ead0a3, #d4c4a3); color: #3c271c; border-color: #ead0a3; }
    .btn-secondary { background: transparent; color: #ead0a3; border-color: #ead0a3; }

    .layout-label { position: absolute; top: 10px; right: 10px; background: rgba(0,0,0,0.7); color: #fff; padding: 8px 16px; border-radius: 8px; font-size: 14px; z-index: 100; }
  </style>
</head>
<body>
  <div class="phone-frame">
    <div class="layout-label">布局3：全屏布局 - 无Tab（无边栏，强调线性层级导航）</div>

    <div class="fullscreen">
      <div class="header">
        <div class="main-title">武将体验卡</div>
        <div class="sub-title">预流失召回 · Day 1</div>
      </div>

      <div class="progress-bar">
        <div class="day-badge active">
          <span>1</span>
          <span>Day</span>
        </div>
        <div class="day-badge">
          <span>2</span>
          <span>Day</span>
        </div>
        <div class="day-badge">
          <span>3</span>
          <span>Day</span>
        </div>
      </div>

      <div class="hero-showcase">
        <div class="hero-card-large">
          <div class="hero-avatar">🎴</div>
          <div class="hero-name-large">界钟会</div>
          <div class="hero-quality">传说品质</div>
          <div class="hero-duration">有效期：7天</div>
        </div>
      </div>

      <div class="bottom-actions">
        <button class="btn-large btn-primary">立即领取</button>
        <button class="btn-large btn-secondary">查看规则</button>
      </div>
    </div>
  </div>
</body>
</html>
