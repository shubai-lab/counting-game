<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>预流失召回链路 · 交互原型 v1.0</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    /* 横屏容器 - 适配 1750x750 比例 */
    .landscape-frame {
      position: relative;
      width: 100vw;
      height: 42.86vw; /* 750/1750 = 0.4286 */
      max-height: 100vh;
      max-width: 233.33vh; /* 1750/750 = 2.3333 */
      margin: auto;
      overflow: hidden;
      background: #0a0a0a;
    }

    /* 设计稿图片 */
    .proto-bg {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      object-fit: contain;
    }

    /* 动效 */
    .page-enter { animation: pageEnter 0.3s ease-out forwards; }
    @keyframes pageEnter {
      from { opacity: 0; transform: scale(0.95); }
      to { opacity: 1; transform: scale(1); }
    }

    .modal-in { animation: modalIn 0.3s cubic-bezier(0.22, 1, 0.36, 1) forwards; }
    .modal-out { animation: modalOut 0.2s ease-in forwards; }
    @keyframes modalIn {
      from { opacity: 0; transform: scale(0.9) translateY(10px); }
      to { opacity: 1; transform: scale(1) translateY(0); }
    }
    @keyframes modalOut {
      from { opacity: 1; transform: scale(1); }
      to { opacity: 0; transform: scale(0.95); }
    }

    .fade-in { animation: fadeIn 0.25s ease-out forwards; }
    @keyframes fadeIn {
      from { opacity: 0; }
      to { opacity: 1; }
    }

    /* 按钮热区 */
    .btn-hotspot {
      position: absolute;
      cursor: pointer;
      border-radius: 8px;
      transition: background 0.15s;
    }
    .btn-hotspot:active {
      background: rgba(255, 255, 255, 0.1);
    }

    /* 调试：显示热区边框 */
    .debug-mode .btn-hotspot {
      border: 2px dashed rgba(255, 100, 100, 0.5);
    }

    /* 遮罩 */
    .mask-layer {
      background: rgba(0, 0, 0, 0.6);
    }

    /* Toast */
    .toast-msg {
      animation: toastShow 0.3s ease-out, toastHide 0.3s ease-in 1.7s forwards;
    }
    @keyframes toastShow {
      from { opacity: 0; transform: translateY(-10px); }
      to { opacity: 1; transform: translateY(0); }
    }
    @keyframes toastHide {
      from { opacity: 1; }
      to { opacity: 0; }
    }

    /* 任务状态指示 */
    .task-dot {
      width: 12px;
      height: 12px;
      border-radius: 50%;
    }
    .task-dot.pending { background: #666; }
    .task-dot.done { background: #4ade80; }

    /* 进度条 */
    .progress-bar {
      height: 6px;
      background: rgba(255, 255, 255, 0.2);
      border-radius: 3px;
      overflow: hidden;
    }
    .progress-fill {
      height: 100%;
      background: linear-gradient(90deg, #c8963a, #f4d03f);
      border-radius: 3px;
      transition: width 0.3s ease;
    }
  </style>
</head>
<body style="background: #111; overflow: hidden;">

<!-- ================================================ -->
<!--  横屏容器 - 基于 1750x750 设计稿                   -->
<!-- ================================================ -->
<div class="landscape-frame" id="frame">

  <!-- ========== 页面1: 预流失弹窗 ========== -->
  <div id="page-popup" class="absolute inset-0 page-enter" onclick="console.log('弹窗点击')">
    <!-- 背景设计稿 -->
    <img class="proto-bg" src="预流失弹窗.jpg" alt="预流失弹窗" />

    <!-- 关闭按钮 (右上角 X) -->
    <div class="btn-hotspot" onclick="event.stopPropagation(); closePopup();"
         style="top: 12%; right: 28%; width: 4%; height: 6%; background: rgba(255,0,0,0.3);"></div>

    <!-- 立即领取按钮 -->
    <div class="btn-hotspot" onclick="event.stopPropagation(); goToRewardPage();"
         style="bottom: 18%; left: calc(28% + 300px); width: 16%; height: 9%; background: rgba(0,255,0,0.3);">
      <span style="position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);color:white;font-size:12px;">领取</span>
    </div>
  </div>


  <!-- ========== 页面2: 任务界面 ========== -->
  <div id="page-task" class="absolute inset-0 hidden z-10">
    <!-- 背景设计稿 -->
    <img class="proto-bg" src="预流失任务界面.jpg" alt="任务界面" />

    <!-- 关闭按钮 -->
    <div class="btn-hotspot" onclick="closeTask();"
         style="top: 4%; right: 6%; width: 3%; height: 5%; background: rgba(255,0,0,0.3);"></div>

    <!-- 任务1: 登录游戏 -->
    <div id="task-login" class="btn-hotspot" onclick="event.stopPropagation(); doTask('login');"
         style="top: 28%; left: 15%; width: 70%; height: 12%; background: rgba(0,255,0,0.2);">
      <span style="position:absolute;top:50%;left:10%;transform:translateY(-50%);color:white;font-size:10px;">任务1: 登录游戏</span>
    </div>

    <!-- 任务2: 完成对局 -->
    <div id="task-battle" class="btn-hotspot" onclick="event.stopPropagation(); doTask('battle');"
         style="top: 45%; left: 15%; width: 70%; height: 12%; background: rgba(0,255,0,0.2);">
      <span style="position:absolute;top:50%;left:10%;transform:translateY(-50%);color:white;font-size:10px;">任务2: 完成对局</span>
    </div>

    <!-- 领取奖励按钮 -->
    <div id="btn-claim" class="btn-hotspot" onclick="event.stopPropagation(); claimReward();"
         style="bottom: 12%; left: 32%; width: 18%; height: 10%; background: rgba(255,200,0,0.3);">
      <span style="position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);color:white;font-size:10px;">领取奖励</span>
    </div>

    <!-- 调试: 模拟任务完成 -->
    <button onclick="simulateAllTasks()" id="debug-btn"
            class="absolute z-20 bg-yellow-600 text-white text-xs px-2 py-1 rounded"
            style="bottom: 5%; right: 10%;">调试:完成所有任务</button>
  </div>


  <!-- ========== 页面3: 领取界面 (全屏) ========== -->
  <div id="page-reward" class="absolute inset-0 hidden z-20">
    <!-- 背景设计稿 -->
    <img class="proto-bg" src="预流失领取界面.jpg" alt="领取界面" />

    <!-- 领取按钮 -->
    <div class="btn-hotspot" onclick="event.stopPropagation(); doClaim();"
         style="bottom: 13%; left: calc(38% + 150px); width: 12%; height: 6%; background: rgba(255,200,0,0.3);">
      <span style="position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);color:white;font-size:10px;">确认领取</span>
    </div>

    <!-- 知道了按钮 (弹窗关闭) -->
    <div class="btn-hotspot" onclick="event.stopPropagation(); closeReward();"
         style="bottom: 8%; right: 32%; width: 10%; height: 5%; background: rgba(255,0,0,0.3);">
      <span style="position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);color:white;font-size:10px;">关闭</span>
    </div>
  </div>


  <!-- ========== 页面4: 领取武将体验卡界面 (点击任意地方关闭) ========== -->
  <div id="page-card" class="absolute inset-0 hidden z-[25]" style="background: #000;">
    <!-- 背景设计稿 -->
    <img id="card-bg" class="proto-bg" src="领取武将体验卡.jpg" alt="领取武将体验卡"
         onload="console.log('Card image loaded');"
         onerror="console.log('Card image failed to load');" />
    <!-- 点击遮罩关闭 -->
    <div id="card-overlay" class="absolute inset-0 cursor-pointer" onclick="closeCardPage();"></div>
  </div>


  <!-- ========== Toast 提示区 ========== -->
  <div id="toast-container" class="absolute top-4 left-1/2 -translate-x-1/2 z-50 flex flex-col gap-2 items-center pointer-events-none"></div>

</div><!-- end .landscape-frame -->


<!-- ================================================ -->
<!--  JavaScript 交互逻辑                              -->
<!-- ================================================ -->
<script>
  // 状态
  const state = {
    tasks: {
      login: false,   // 登录游戏
      battle: false   // 完成对局
    },
    claimed: false
  };

  // 更新任务UI
  function updateTaskUI() {
    const loginEl = document.getElementById('task-login');
    const battleEl = document.getElementById('task-battle');
    const claimBtn = document.getElementById('btn-claim');

    // 更新任务状态样式（添加完成标记）
    if (state.tasks.login) {
      loginEl.style.outline = '3px solid #4ade80';
    }
    if (state.tasks.battle) {
      battleEl.style.outline = '3px solid #4ade80';
    }

    // 更新领取按钮状态
    const allDone = state.tasks.login && state.tasks.battle;
    if (allDone) {
      claimBtn.style.outline = '3px solid #c8963a';
    } else {
      claimBtn.style.outline = 'none';
    }
  }

  // 执行任务
  function doTask(taskName) {
    if (state.tasks[taskName]) {
      showToast('该任务已完成', 'info');
      return;
    }
    state.tasks[taskName] = true;
    showToast(`${taskName === 'login' ? '登录游戏' : '完成对局'} 任务完成！`, 'success');
    updateTaskUI();
  }

  // 调试：模拟完成所有任务
  function simulateAllTasks() {
    state.tasks.login = true;
    state.tasks.battle = true;
    updateTaskUI();
    showToast('已模拟完成所有任务', 'info');
  }

  // 弹窗关闭
  function closePopup() {
    const page = document.getElementById('page-popup');
    page.classList.remove('page-enter');
    page.classList.add('modal-out');
    setTimeout(() => {
      page.classList.add('hidden');
    }, 200);
  }

  // 弹窗点击领取 -> 跳转领取界面
  function goToRewardPage() {
    const popup = document.getElementById('page-popup');
    const reward = document.getElementById('page-reward');

    popup.classList.remove('page-enter');
    popup.classList.add('modal-out');

    setTimeout(() => {
      popup.classList.add('hidden');
      reward.classList.remove('hidden');
    }, 200);
  }

  // 确认领取 -> 显示武将体验卡界面
  function doClaim() {
    const reward = document.getElementById('page-reward');
    const card = document.getElementById('page-card');
    const cardOverlay = document.getElementById('card-overlay');

    console.log('doClaim called');

    if (!state.claimed) {
      state.claimed = true;
      showToast('恭喜获得: 武将将符 x30', 'success');
    }

    // 强制移除hidden，显示武将体验卡界面
    setTimeout(() => {
      console.log('Showing card page');
      reward.style.display = 'none';
      card.style.display = 'block';
      card.style.opacity = '1';
      card.classList.add('fade-in');
      if (cardOverlay) cardOverlay.style.display = 'block';
      console.log('Card shown');
    }, 500);
  }

  // 关闭武将体验卡界面 -> 进入任务界面
  function closeCardPage() {
    console.log('closeCardPage called');
    const card = document.getElementById('page-card');
    const task = document.getElementById('page-task');
    const cardOverlay = document.getElementById('card-overlay');

    card.classList.add('modal-out');

    setTimeout(() => {
      card.style.display = 'none';
      card.classList.remove('modal-out', 'fade-in');
      if (cardOverlay) cardOverlay.style.display = 'none';
      task.style.display = 'block';
      task.classList.add('page-enter');

      // 重置状态
      state.tasks.login = false;
      state.tasks.battle = false;
      state.claimed = false;
      updateTaskUI();
    }, 200);
  }

  // 关闭任务界面
  function closeTask() {
    const task = document.getElementById('page-task');
    const popup = document.getElementById('page-popup');

    task.classList.remove('page-enter');
    task.classList.add('modal-out');

    setTimeout(() => {
      task.classList.add('hidden');
      popup.classList.remove('hidden');
      popup.classList.add('page-enter');
      // 重置状态
      state.tasks.login = false;
      state.tasks.battle = false;
      updateTaskUI();
    }, 200);
  }

  // 领取奖励（任务未完成提示）
  function claimReward() {
    if (!state.tasks.login || !state.tasks.battle) {
      showToast('请先完成任务后再领取', 'warning');
      return;
    }
    // 显示领取弹窗
    const reward = document.getElementById('page-reward');
    reward.classList.remove('hidden');
  }

  // 确认领取
  function doClaim() {
    if (state.claimed) {
      showToast('奖励已领取', 'info');
      return;
    }
    state.claimed = true;
    showToast('恭喜获得: 武将将符 x30', 'success');

    // 关闭领取界面
    setTimeout(() => {
      closeReward();
      // 重置状态
      state.tasks.login = false;
      state.tasks.battle = false;
      state.claimed = false;
      updateTaskUI();
    }, 1500);
  }

  // 关闭领取界面
  function closeReward() {
    const reward = document.getElementById('page-reward');
    const inner = reward.querySelector('.fade-in');
    if (inner) {
      inner.classList.remove('fade-in');
      inner.classList.add('modal-out');
    }
    setTimeout(() => {
      reward.classList.add('hidden');
      if (inner) {
        inner.classList.remove('modal-out');
        inner.classList.add('fade-in');
      }
    }, 200);
  }

  // Toast 提示
  function showToast(message, type = 'info') {
    const container = document.getElementById('toast-container');
    const colors = {
      success: 'bg-green-900 border border-green-500 text-green-200',
      warning: 'bg-yellow-900 border border-yellow-500 text-yellow-200',
      error: 'bg-red-900 border border-red-500 text-red-200',
      info: 'bg-gray-800 border border-gray-600 text-gray-200'
    };

    const toast = document.createElement('div');
    toast.className = `toast-msg px-6 py-3 rounded-xl text-sm font-bold pointer-events-auto ${colors[type]}`;
    toast.textContent = message;
    container.appendChild(toast);

    setTimeout(() => {
      if (toast.parentNode) {
        toast.parentNode.removeChild(toast);
      }
    }, 2000);
  }

  // 初始化
  updateTaskUI();
</script>

</body>
</html>
