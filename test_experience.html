<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Test - 预流失用户体验</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; }
  </style>
</head>
<body class="bg-gray-100 min-h-screen">
  <div class="max-w-6xl mx-auto px-4 py-6">
    <h1 class="text-2xl font-bold mb-6">预流失用户体验 Test</h1>
    
    <div class="bg-gradient-to-r from-amber-50 to-orange-50 rounded-xl shadow-sm p-6 border-l-4 border-amber-400">
      <h2 class="text-xl font-bold text-gray-800 mb-4">预流失用户的核心矛盾</h2>
      <div class="flex items-center justify-center gap-8 py-6">
        <div class="text-center">
          <div class="text-5xl mb-2">🎮</div>
          <div class="text-2xl font-bold text-amber-700">还在玩</div>
        </div>
        <div class="text-3xl text-gray-400">→</div>
        <div class="text-center">
          <div class="text-5xl mb-2">😢</div>
          <div class="text-2xl font-bold text-red-600">即将流失</div>
        </div>
      </div>
    </div>
    
    <div class="mt-6 bg-white rounded-xl shadow-sm p-6">
      <h3 class="font-bold text-lg mb-4">三体验模块</h3>
      <div class="grid grid-cols-1 md:grid-cols-3 gap-6">
        <div class="border-2 border-amber-300 rounded-xl p-5 bg-amber-50">
          <div class="text-2xl mb-2">🎯</div>
          <h4 class="font-bold text-amber-800">模式体验</h4>
          <p class="text-sm text-gray-600 mt-2">给用户新鲜感，打破疲惫感</p>
        </div>
        <div class="border-2 border-green-300 rounded-xl p-5 bg-green-50">
          <div class="text-2xl mb-2">🏆</div>
          <h4 class="font-bold text-green-800">目标体验</h4>
          <p class="text-sm text-gray-600 mt-2">帮助用户重新找到目标感</p>
        </div>
        <div class="border-2 border-blue-300 rounded-xl p-5 bg-blue-50">
          <div class="text-2xl mb-2">👥</div>
          <h4 class="font-bold text-blue-800">社交体验</h4>
          <p class="text-sm text-gray-600 mt-2">通过社交羁绊留住用户</p>
        </div>
      </div>
    </div>
  </div>
</body>
</html>
